# Shared Core State, OTA Splash Hooks, Preview Auto-Revert, Map Renderer, 10fps Sprite Engine & Palette Engine
globals:
  - { id: bg_cache, type: 'uint8_t *', restore_value: no, initial_value: 'nullptr' }
  - { id: boot_complete, type: bool, restore_value: no, initial_value: 'false' }
  - { id: boot_grace_done, type: bool, restore_value: no, initial_value: 'false' }
  - { id: ota_active, type: bool, restore_value: no, initial_value: 'false' }
  - { id: force_redraw, type: bool, restore_value: no, initial_value: 'false' }
  - { id: map_just_flushed, type: bool, restore_value: no, initial_value: 'false' }
  - { id: sprites_dirty, type: bool, restore_value: no, initial_value: 'true' }
  - { id: last_ota_pct, type: int, restore_value: no, initial_value: '-5' }
  - { id: overlay_state, type: uint8_t, restore_value: no, initial_value: '255' }
  # 0=Day, 1=Deep Sleep (Red), 2=Morning Quiet Play (Amber), 3=Evening Wind-Down (Amber)
  - { id: sleep_phase, type: uint8_t, restore_value: no, initial_value: '1' }
  - { id: ui_palette, type: uint8_t, restore_value: no, initial_value: '1' }
  - { id: applied_palette, type: uint8_t, restore_value: no, initial_value: '255' }
  - { id: applied_backlight_phase, type: uint8_t, restore_value: no, initial_value: '255' }
  - { id: active_occasion, type: uint8_t, restore_value: no, initial_value: '1' }
  - { id: badge_mode_applied, type: uint8_t, restore_value: no, initial_value: '255' }
  # Active profile & display preferences (populated by HA or Standalone backend)
  - { id: active_child_name, type: std::string, restore_value: no, initial_value: '"${default_child_name}"' }
  - { id: active_loc_name, type: std::string, restore_value: no, initial_value: '"${default_location}"' }
  - { id: active_lat, type: float, restore_value: no, initial_value: '${default_lat}' }
  - { id: active_lon, type: float, restore_value: no, initial_value: '${default_lon}' }
  - { id: active_birth_year, type: int, restore_value: no, initial_value: '${default_birth_year}' }
  - { id: use_24h_clock, type: bool, restore_value: no, initial_value: '${default_use_24h}' }
  - { id: use_fahrenheit, type: bool, restore_value: no, initial_value: '${default_use_fahrenheit}' }
  - { id: use_miles, type: bool, restore_value: no, initial_value: '${default_use_miles}' }
  - { id: show_night_lights, type: bool, restore_value: no, initial_value: '${default_night_lights}' }
  - { id: keep_santa_winddown, type: bool, restore_value: no, initial_value: '${default_santa_in_winddown}' }
  # Resolved custom dock messages (tokens like {quiet}/{name} already expanded)
  - { id: msg_sleep_title_resolved, type: std::string, restore_value: no, initial_value: '"SLEEP TIME"' }
  - { id: msg_sleep_sub_resolved, type: std::string, restore_value: no, initial_value: '"Sweet dreams!"' }
  - { id: msg_quiet_title_resolved, type: std::string, restore_value: no, initial_value: '"OK TO GET UP"' }
  - { id: msg_quiet_sub_resolved, type: std::string, restore_value: no, initial_value: '"Quiet play in your room OK!"' }
  - { id: msg_winddown_title_resolved, type: std::string, restore_value: no, initial_value: '"GET READY FOR BED"' }
  - { id: msg_winddown_sub_resolved, type: std::string, restore_value: no, initial_value: '"Pyjamas, teeth & story time!"' }
  - { id: msg_xmas_title_resolved, type: std::string, restore_value: no, initial_value: '"MERRY CHRISTMAS!"' }
  - { id: msg_xmas_sub_resolved, type: std::string, restore_value: no, initial_value: '"Time to open presents!"' }
  # Unified Weather Telemetry (populated by HA sensors or Core 0 Open-Meteo)
  - { id: cur_wx_temp, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: cur_wx_feels, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: cur_wx_high, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: cur_wx_low, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: cur_wx_cond, type: std::string, restore_value: no, initial_value: '"cloudy"' }
  - { id: cur_wx_today_cond, type: std::string, restore_value: no, initial_value: '""' }
  - { id: cur_wx_precip_pct, type: int, restore_value: no, initial_value: '-1' }
  - { id: cur_wx_3day, type: std::string, restore_value: no, initial_value: '""' }
  - { id: cur_wx_age_ok, type: bool, restore_value: no, initial_value: 'false' }
  - { id: tracked_yday, type: int, restore_value: no, initial_value: '-1' }
  - { id: tracked_high, type: float, restore_value: no, initial_value: '-999.0' }
  - { id: tracked_low, type: float, restore_value: no, initial_value: '999.0' }
  # Unified ISS Dead-Reckoning State
  - { id: iss_cur_lat, type: float, restore_value: no, initial_value: '0.0' }
  - { id: iss_cur_lon, type: float, restore_value: no, initial_value: '0.0' }
  - { id: iss_vel_lat, type: float, restore_value: no, initial_value: '0.0' }
  - { id: iss_vel_lon, type: float, restore_value: no, initial_value: '0.06' }
  - { id: iss_fix_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: iss_has_fix, type: bool, restore_value: no, initial_value: 'false' }
  - { id: iss_is_eclipsed, type: bool, restore_value: no, initial_value: 'false' }
  # 30-City Santa Route State
  - { id: santa_wp_idx, type: int, restore_value: no, initial_value: '-1' }
  - { id: santa_lat, type: float, restore_value: no, initial_value: '75.0' }
  - { id: santa_lon, type: float, restore_value: no, initial_value: '0.0' }
  - { id: santa_city, type: std::string, restore_value: no, initial_value: '"NORTH POLE"' }
  - { id: santa_dist_km, type: int, restore_value: no, initial_value: '0' }
  - { id: santa_gifts_m, type: int, restore_value: no, initial_value: '0' }
  # Kid-Friendly Quirks, Overrides, Demo Mode & Family/School Calendar State
  - { id: sleep_remaining_01, type: float, restore_value: no, initial_value: '-1.0' }
  - { id: tooth_fairy_active, type: bool, restore_value: no, initial_value: 'false' }
  - { id: nap_end_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: nap_total_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: winddown_override_yday, type: int, restore_value: no, initial_value: '-1' }
  - { id: demo_mode_active, type: bool, restore_value: no, initial_value: 'false' }
  - { id: demo_mode_idx, type: int, restore_value: no, initial_value: '0' }
  - { id: parent_note_text, type: std::string, restore_value: no, initial_value: '""' }
  - { id: parent_note_yday, type: int, restore_value: no, initial_value: '-1' }
  - { id: cal_today_event, type: std::string, restore_value: no, initial_value: '""' }
  - { id: cal_tomorrow_event, type: std::string, restore_value: no, initial_value: '""' }
  - { id: cal_next_event, type: std::string, restore_value: no, initial_value: '""' }
  - { id: cal_next_days, type: int, restore_value: no, initial_value: '-1' }
  - { id: cal_school_holiday, type: bool, restore_value: no, initial_value: 'false' }
  - { id: cal_school_note, type: std::string, restore_value: no, initial_value: '""' }
  - { id: cal_school_configured, type: bool, restore_value: no, initial_value: 'false' }
  # Rich v1.1 Calendar, Morning Launchpad & Focus Pomodoro State
  - { id: fam_cal_summary, type: 'world_clock::IcsFeedSummary', restore_value: no }
  - { id: sch_cal_summary, type: 'world_clock::IcsFeedSummary', restore_value: no }
  - { id: cal_priority_mode, type: int, restore_value: no, initial_value: '0' }
  - { id: cal_display_style, type: int, restore_value: no, initial_value: '0' }
  - { id: launchpad_start_min, type: int, restore_value: no, initial_value: '420' }
  - { id: school_leave_min, type: int, restore_value: no, initial_value: '510' }
  - { id: launchpad_hide_delay_min, type: int, restore_value: no, initial_value: '30' }
  - { id: cal_prominent_active, type: bool, restore_value: no, initial_value: 'false' }
  - { id: cal_prominent_title, type: std::string, restore_value: no, initial_value: '""' }
  - { id: cal_prominent_sub, type: std::string, restore_value: no, initial_value: '""' }
  - { id: launchpad_visible, type: bool, restore_value: no, initial_value: 'false' }
  - { id: focus_end_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: focus_total_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: focus_is_break, type: bool, restore_value: no, initial_value: 'false' }
  - { id: focus_rem_01, type: float, restore_value: no, initial_value: '-1.0' }
  - { id: focus_title, type: std::string, restore_value: no, initial_value: '""' }
  - { id: focus_sub, type: std::string, restore_value: no, initial_value: '""' }
  - { id: minimal_teen_mode, type: bool, restore_value: no, initial_value: 'false' }
  # Shared Custom Countdown + Wake-Up & Kids Schedule State (populated by Standalone or ha_kids_calendar.yaml)
  - { id: active_cd_name, type: std::string, restore_value: no, initial_value: '""' }
  - { id: active_cd_days, type: int, restore_value: no, initial_value: '-1' }
  - { id: eff_wakeup_min_today, type: int, restore_value: no, initial_value: '390' }
  - { id: sched_weekend_en, type: bool, restore_value: no, initial_value: 'false' }
  - { id: sched_holiday_liein_en, type: bool, restore_value: no, initial_value: 'true' }
  - { id: sched_late_bed_en, type: bool, restore_value: no, initial_value: 'false' }
  - { id: sched_weekend_offset_m, type: int, restore_value: no, initial_value: '60' }
  - { id: sched_late_bed_offset_m, type: int, restore_value: no, initial_value: '30' }
  - { id: sched_sleep_stars_en, type: bool, restore_value: no, initial_value: 'true' }

select:
  - platform: template
    name: "Occasion & Preview Mode"
    id: occasion_select
    optimistic: true
    restore_value: false
    initial_option: "Auto"
    options:
      - "Auto"
      - "Wind-Down Preview (Amber)"
      - "Sleep Preview (Red)"
      - "Quiet Play Preview (Amber)"
      - "Classic Map"
      - "ISS Space Tracker"
      - "Birthday Mode"
      - "Christmas Advent"
      - "Christmas Day"
      - "Santa Tracker"
      - "Halloween"
      - "Easter Egg Hunt"
      - "Fireworks"
      - "Star Wars Day"
      - "Morning Launchpad Preview"
      - "No-School Holiday Preview"
      - "Focus Study Timer Preview"
    on_value:
      then:
        - lambda: |-
            id(badge_mode_applied) = 255;
            id(force_redraw) = true;
        - if:
            condition:
              lambda: 'return x != "Auto";'
            then:
              - script.execute: preview_revert_timer
            else:
              - script.stop: preview_revert_timer

script:
  # Lock-free, cross-task safe OTA hooks: NEVER call lv_* or lv_timer_handler() from async HTTP/OTA tasks!
  # Core 1's 100ms interval consumes world_clock::ota_ui_state() and updates LVGL safely on the main loop.
  - id: ota_splash_begin
    mode: single
    then:
      - lambda: |-
          __atomic_store_n(&id(ota_active), true, __ATOMIC_RELEASE);
          #if defined(USE_WORLD_CLOCK_NET_WORKER)
            world_clock::standalone_telemetry().ota_active.store(true, std::memory_order_release);
          #endif
          world_clock::ota_ui_state().pct.store(0, std::memory_order_relaxed);
          world_clock::ota_ui_state().state.store(1, std::memory_order_release);

  - id: ota_splash_end
    mode: single
    then:
      - lambda: |-
          world_clock::ota_ui_state().pct.store(100, std::memory_order_relaxed);
          world_clock::ota_ui_state().state.store(2, std::memory_order_release);

  - id: ota_splash_error
    mode: single
    then:
      - lambda: |-
          __atomic_store_n(&id(ota_active), false, __ATOMIC_RELEASE);
          #if defined(USE_WORLD_CLOCK_NET_WORKER)
            world_clock::standalone_telemetry().ota_active.store(false, std::memory_order_release);
          #endif
          world_clock::ota_ui_state().state.store(3, std::memory_order_release);

  - id: preview_revert_timer
    mode: restart
    then:
      - delay: 10min
      - select.set:
          id: occasion_select
          option: "Auto"

  - id: render_world_map
    mode: single
    then:
      - lambda: |-
          if (__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE)) return;
          auto utc = id(clock_time).utcnow();
          auto loc = id(clock_time).now();
          world_clock::WorldMapParams p;
          p.home_lat = id(active_lat);
          p.home_lon = id(active_lon);
          if (utc.is_valid()) {
            p.doy = utc.day_of_year;
            p.utc_hr = (float)utc.hour + (float)utc.minute / 60.0f + (float)utc.second / 3600.0f;
          }
          p.loc_valid = loc.is_valid();
          if (loc.is_valid()) {
            p.loc_month = loc.month;
            p.loc_day = loc.day_of_month;
          }
          p.pal = id(ui_palette);
          p.mode = id(active_occasion);
          p.sleep_phase = id(sleep_phase);
          p.santa_wp_idx = id(santa_wp_idx);
          p.show_night_lights = id(show_night_lights);
          p.keep_santa_winddown = id(keep_santa_winddown);
          world_clock::render_world_map_canvas(
              id(world_canvas), id(bg_cache), p, id(sprites_dirty), id(map_just_flushed));

  - id: apply_shell_palette
    mode: single
    then:
      - lambda: 'id(applied_palette) = id(ui_palette);'
      - if:
          condition:
            lambda: 'return id(ui_palette) == 1;'
          then:
            - lvgl.label.update: { id: clock_label, text_color: 0xE61922 }
            - lvgl.label.update: { id: ampm_label, text_color: 0xD91E26 }
            - lvgl.label.update: { id: date_label, text_color: 0xD91E26 }
            - lvgl.widget.update: { id: loc_pill, bg_color: 0x1C0205, border_color: 0x5C0B13 }
            - lvgl.label.update: { id: loc_label, text_color: 0xFF2B35 }
            - lvgl.label.update: { id: ticker_label, text_color: 0x8F141B }
            - lvgl.widget.update: { id: header_divider, bg_color: 0x260407 }
            - lvgl.widget.update: { id: dock_divider, bg_color: 0x260407 }
      - if:
          condition:
            lambda: 'return id(ui_palette) == 2;'
          then:
            - lvgl.label.update: { id: clock_label, text_color: 0xFF9418 }
            - lvgl.label.update: { id: ampm_label, text_color: 0xE88214 }
            - lvgl.label.update: { id: date_label, text_color: 0xE88214 }
            - lvgl.widget.update: { id: loc_pill, bg_color: 0x241102, border_color: 0x6E3805 }
            - lvgl.label.update: { id: loc_label, text_color: 0xFFA428 }
            - lvgl.label.update: { id: ticker_label, text_color: 0xC8680A }
            - lvgl.widget.update: { id: header_divider, bg_color: 0x2E1603 }
            - lvgl.widget.update: { id: dock_divider, bg_color: 0x2E1603 }
      - if:
          condition:
            lambda: 'return id(ui_palette) == 0;'
          then:
            - lvgl.label.update: { id: clock_label, text_color: 0xFFF6EA }
            - lvgl.label.update: { id: ampm_label, text_color: 0xFF7A00 }
            - lvgl.label.update: { id: date_label, text_color: 0xEFE6DA }
            - lvgl.widget.update: { id: loc_pill, bg_color: 0x261302, border_color: 0x7A3E04 }
            - lvgl.label.update: { id: loc_label, text_color: 0xFF7A00 }
            - lvgl.label.update: { id: ticker_label, text_color: 0xFFB830 }
            - lvgl.widget.update: { id: header_divider, bg_color: 0x24262D }
            - lvgl.widget.update: { id: dock_divider, bg_color: 0x24262D }
      - script.execute: apply_dock_palette
      - script.execute: render_world_map
      - script.execute: render_dock

  - id: update_launchpad_ui
    mode: single
    then:
      - lambda: |-
          if (!id(launchpad_visible)) {
            lv_obj_add_flag(id(launchpad_overlay), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_add_flag(id(tracker_badge), LV_OBJ_FLAG_HIDDEN);
          #if LVGL_VERSION_MAJOR >= 9
            lv_obj_remove_flag(id(launchpad_overlay), LV_OBJ_FLAG_HIDDEN);
          #else
            lv_obj_clear_flag(id(launchpad_overlay), LV_OBJ_FLAG_HIDDEN);
          #endif

          auto now = id(clock_time).now();
          std::string sel = id(occasion_select).current_option();
          bool preview_school = (sel == "Morning Launchpad Preview");
          bool preview_hol = (sel == "No-School Holiday Preview");
          int now_m = now.is_valid() ? (now.hour * 60 + now.minute) : 488;
          int dow = now.is_valid() ? world_clock::ymd_dow_num(now.year, now.month, now.day_of_month) : 1;
          bool is_wknd = preview_school ? false : (dow == 0 || dow == 6);
          bool is_hol = preview_hol ? true : (preview_school ? false : (id(cal_school_holiday) || id(fam_cal_summary).today_is_school_holiday || id(sch_cal_summary).today_is_school_holiday));
          bool is_non_school = is_wknd || is_hol;

          world_clock::IcsFeedSummary fam_use = id(fam_cal_summary);
          world_clock::IcsFeedSummary sch_use = id(sch_cal_summary);
          if (preview_school && !fam_use.valid && !sch_use.valid) {
            now_m = id(school_leave_min) - 22;
            snprintf(fam_use.today_allday, sizeof(fam_use.today_allday), "PE Kit & Reading Book");
            fam_use.today_timed[0].valid = true;
            fam_use.today_timed[0].minute_of_day = 16 * 60;
            snprintf(fam_use.today_timed[0].title, sizeof(fam_use.today_timed[0].title), "Swimming Lesson");
            snprintf(fam_use.tomorrow_title, sizeof(fam_use.tomorrow_title), "Non-Uniform Day");
            sch_use.next_school_holiday_days = 8;
            snprintf(sch_use.next_school_holiday_name, sizeof(sch_use.next_school_holiday_name), "Half Term");
          } else if (preview_hol && !sch_use.today_is_school_holiday) {
            sch_use.today_is_school_holiday = true;
            snprintf(sch_use.school_note, sizeof(sch_use.school_note), "Half Term");
            sch_use.back_to_school_days = 3;
            if (!fam_use.valid) {
              fam_use.today_timed[0].valid = true;
              fam_use.today_timed[0].minute_of_day = 10 * 60 + 30;
              snprintf(fam_use.today_timed[0].title, sizeof(fam_use.today_timed[0].title), "Science Museum Trip");
              snprintf(fam_use.tomorrow_title, sizeof(fam_use.tomorrow_title), "Grandma Visiting");
            }
          }

          auto cv = world_clock::build_calendar_view(
              fam_use, sch_use,
              id(cal_school_configured) || is_hol || preview_school || preview_hol, is_wknd, now_m,
              id(cal_priority_mode), (now.is_valid() ? now.second / 12 : 0),
              id(use_24h_clock), id(active_cd_name), id(active_cd_days));

          // 1. Top School Status Pill & Leave-for-School Countdown Bar
          std::string badge = cv.school_badge.empty() ? (is_non_school ? "NO SCHOOL DAY" : "SCHOOL DAY") : cv.school_badge;
          lv_label_set_text(id(lp_school_lbl), badge.c_str());
          if (is_non_school) {
            lv_obj_set_style_bg_color(id(lp_school_pill), lv_color_hex(0x2E1A04), 0);
            lv_obj_set_style_border_color(id(lp_school_pill), lv_color_hex(0xF59E0B), 0);
            lv_obj_set_style_text_color(id(lp_school_lbl), lv_color_hex(0xFCD34D), 0);
            lv_obj_set_style_bg_color(id(lp_countdown_bar), lv_color_hex(0xF59E0B), LV_PART_INDICATOR);
            lv_label_set_text(id(lp_countdown_lbl), "NO SCHOOL TODAY · ENJOY YOUR DAY!");
            lv_bar_set_value(id(lp_countdown_bar), 100, LV_ANIM_OFF);
          } else {
            lv_obj_set_style_bg_color(id(lp_school_pill), lv_color_hex(0x0B3B3A), 0);
            lv_obj_set_style_border_color(id(lp_school_pill), lv_color_hex(0x14B8A6), 0);
            lv_obj_set_style_text_color(id(lp_school_lbl), lv_color_hex(0x5EEAD4), 0);
            int leave_m = id(school_leave_min);
            int span_m = std::max(15, leave_m - id(launchpad_start_min));
            int grace_m = std::max(5, id(launchpad_hide_delay_min));
            int rem_m = leave_m - now_m;
            char cdl[56];
            int pct = 100;
            uint32_t bar_col = 0x14B8A6;
            if (rem_m > 0) {
              snprintf(cdl, sizeof(cdl), "LEAVE FOR SCHOOL IN %d MIN", rem_m);
              pct = std::clamp((int)((span_m - rem_m) * 100 / span_m), 5, 98);
              if (rem_m <= 10) bar_col = 0xF59E0B;
            } else if (-rem_m <= grace_m) {
              snprintf(cdl, sizeof(cdl), "TIME TO LEAVE FOR SCHOOL!");
              pct = 100;
              bar_col = 0xEF4444;
            } else {
              std::string lt = world_clock::format_short_time(leave_m / 60, leave_m % 60, id(use_24h_clock));
              snprintf(cdl, sizeof(cdl), "SCHOOL DAY · LEAVE AT %s", lt.c_str());
              pct = 100;
            }
            lv_obj_set_style_bg_color(id(lp_countdown_bar), lv_color_hex(bar_col), LV_PART_INDICATOR);
            lv_label_set_text(id(lp_countdown_lbl), cdl);
            lv_bar_set_value(id(lp_countdown_bar), pct, LV_ANIM_OFF);
          }
          lv_obj_set_size(id(lp_school_pill), LV_SIZE_CONTENT, LV_SIZE_CONTENT);

          // 2. Left Card: Today's Plan Bullets (Parent Note takes slot 0 if set; uses middle-dot glyph in Fira Code subset)
          std::string p1 = !id(parent_note_text).empty() ? ("· " + id(parent_note_text))
                                                         : (cv.plan_lines[0].empty() ? "· Regular Routine" : ("· " + cv.plan_lines[0]));
          std::string p2 = cv.plan_lines[1].empty() ? "" : ("· " + cv.plan_lines[1]);
          std::string p3 = cv.plan_lines[2].empty() ? "" : ("· " + cv.plan_lines[2]);
          lv_label_set_text(id(lp_plan_1), p1.c_str());
          lv_label_set_text(id(lp_plan_2), p2.c_str());
          lv_label_set_text(id(lp_plan_3), p3.c_str());

          // 3. Right Card: Whole-Day "PACK & WEAR FOR TODAY" Briefing & Holiday/Countdown Pill
          // Focuses on full-day trajectory (dry now -> rain later, cool AM -> hot PM swing, all-day cold)
          // rather than duplicating Band 3's current-moment weather readout!
          float tc = id(cur_wx_temp);
          float hi = id(cur_wx_high);
          float lo = id(cur_wx_low);
          if (std::isnan(hi) && id(tracked_yday) >= 0 && id(tracked_high) > -900.0f) {
            hi = id(tracked_high);
            lo = id(tracked_low);
          }
          auto prep = world_clock::build_day_prep_briefing(
              id(cur_wx_cond), id(cur_wx_today_cond), tc, hi, lo, id(cur_wx_precip_pct), id(use_fahrenheit));
          lv_label_set_text(id(lp_wx_summary), prep.headline.c_str());
          lv_label_set_text(id(lp_wx_prep), prep.pack_hint.c_str());

          std::string h_txt = cv.holiday_badge;
          if (h_txt.empty() && !id(cal_next_event).empty() && id(cal_next_days) > 0) {
            char hb[56];
            snprintf(hb, sizeof(hb), "%d SLEEPS TO %s!", id(cal_next_days),
                     world_clock::to_upper_ascii(id(cal_next_event)).c_str());
            h_txt = hb;
          }
          if (h_txt.empty()) {
            lv_obj_add_flag(id(lp_holiday_pill), LV_OBJ_FLAG_HIDDEN);
          } else {
            #if LVGL_VERSION_MAJOR >= 9
              lv_obj_remove_flag(id(lp_holiday_pill), LV_OBJ_FLAG_HIDDEN);
            #else
              lv_obj_clear_flag(id(lp_holiday_pill), LV_OBJ_FLAG_HIDDEN);
            #endif
            lv_label_set_text(id(lp_holiday_lbl), h_txt.c_str());
          }

interval:
  - interval: 100ms
    then:
      - lambda: |-
          // Core 1 LVGL-thread-safe OTA splash consumer (never touched from async HTTP/OTA tasks!)
          {
            static uint8_t s_ota_ui_state = 0;
            static int s_ota_ui_pct = -1;
            uint8_t st = world_clock::ota_ui_state().state.load(std::memory_order_acquire);
            if (st != 0) {
              int pct = std::clamp(world_clock::ota_ui_state().pct.load(std::memory_order_relaxed), 0, 100);
              if (st == 1 && (s_ota_ui_state != 1 || pct >= s_ota_ui_pct + 5 || pct >= 99)) {
                if (s_ota_ui_state != 1) {
                  #if LVGL_VERSION_MAJOR >= 9
                    lv_obj_remove_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
                  #else
                    lv_obj_clear_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
                  #endif
                  lv_obj_add_flag(id(splash_qr_box), LV_OBJ_FLAG_HIDDEN);
                  lv_label_set_text(id(splash_sub), "Installing wireless update  \u2192  Keep power connected");
                  lv_label_set_text(id(splash_hint), "");
                }
                char obuf[48];
                snprintf(obuf, sizeof(obuf), "UPDATING CLOCK... %d%%", pct);
                lv_label_set_text(id(splash_title), obuf);
                lv_bar_set_value(id(splash_bar), pct, LV_ANIM_OFF);
                s_ota_ui_state = 1;
                s_ota_ui_pct = pct;
              } else if (st == 2 && s_ota_ui_state != 2) {
                lv_label_set_text(id(splash_title), "UPDATE COMPLETE  \u2192  REBOOTING!");
                lv_bar_set_value(id(splash_bar), 100, LV_ANIM_OFF);
                s_ota_ui_state = 2;
              } else if (st == 3) {
                world_clock::ota_ui_state().state.store(0, std::memory_order_release);
                s_ota_ui_state = 0;
                s_ota_ui_pct = -1;
                id(overlay_state) = 255;
                lv_obj_add_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
              }
              return;
            }
          }
          if (__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE) || !id(boot_complete) || id(bg_cache) == nullptr || id(launchpad_visible)) return;
          auto utc = id(clock_time).utcnow();
          auto loc = id(clock_time).now();
          world_clock::SpriteFrameParams p;
          p.world_canvas = id(world_canvas);
          p.tracker_badge = id(tracker_badge);
          p.tracker_badge_lbl = id(tracker_badge_lbl);
          p.bg_cache = id(bg_cache);
          p.mode = id(active_occasion);
          p.sleep_phase = id(sleep_phase);
          p.keep_santa_winddown = id(keep_santa_winddown);
          p.manual_santa_preview = (id(occasion_select).current_option() == "Santa Tracker");
          p.tooth_fairy_mode = id(tooth_fairy_active);
          p.home_lat = id(active_lat);
          p.home_lon = id(active_lon);
          p.home_label = id(active_loc_name);
          p.utc_valid = utc.is_valid();
          if (utc.is_valid()) {
            p.utc_month = utc.month;
            p.utc_day = utc.day_of_month;
            p.utc_hr = (float)utc.hour + (float)utc.minute / 60.0f + (float)utc.second / 3600.0f;
          }
          p.loc_valid = loc.is_valid();
          if (loc.is_valid()) {
            p.loc_month = loc.month;
            p.loc_day = loc.day_of_month;
          }
          p.iss_has_fix = id(iss_has_fix);
          p.iss_cur_lat = id(iss_cur_lat);
          p.iss_cur_lon = id(iss_cur_lon);
          p.iss_vel_lat = id(iss_vel_lat);
          p.iss_vel_lon = id(iss_vel_lon);
          p.iss_fix_ms = id(iss_fix_ms);
          p.santa_wp_idx = &id(santa_wp_idx);
          p.santa_lat = &id(santa_lat);
          p.santa_lon = &id(santa_lon);
          p.santa_city = &id(santa_city);
          p.santa_dist_km = &id(santa_dist_km);
          p.santa_gifts_m = &id(santa_gifts_m);
          p.force_redraw = &id(force_redraw);
          p.sprites_dirty = &id(sprites_dirty);
          p.map_just_flushed = &id(map_just_flushed);
          p.badge_mode_applied = &id(badge_mode_applied);
          world_clock::sprite_engine().tick(p);

  - interval: 10s
    then:
      - lambda: |-
          if (!id(demo_mode_active) || !id(boot_complete) || __atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE)) return;
          static const char *const kDemoModes[] = {
              "ISS Space Tracker",
              "Wind-Down Preview (Amber)",
              "Sleep Preview (Red)",
              "Quiet Play Preview (Amber)",
              "Birthday Mode",
              "Halloween",
              "Christmas Advent",
              "Santa Tracker",
              "Easter Egg Hunt",
              "Fireworks",
              "Star Wars Day",
          };
          constexpr int kDemoN = (int)(sizeof(kDemoModes) / sizeof(kDemoModes[0]));
          int idx = id(demo_mode_idx) % kDemoN;
          id(demo_mode_idx) = (idx + 1) % kDemoN;
          auto call = id(occasion_select).make_call();
          call.set_option(kDemoModes[idx]);
          call.perform();

  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete) && !__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE);'
          then:
            - script.execute: render_world_map

  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete) && !__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE);'
          then:
            - script.execute: render_dock
