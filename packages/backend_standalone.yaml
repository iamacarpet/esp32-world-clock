# Standalone Backend: Core 0 Open-Meteo + ISS NetWorker, Google NTP, Captive Portal & Full iPhone Web UI v3
world_clock:
  standalone: true

esphome:
  includes:
    - <esp_crt_bundle.h>
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // Universal multi-device release mode: derive a unique per-board Web UI password
            // ("clock-<last6mac>") when name_add_mac_suffix is enabled, and publish diagnostics.
            std::string mac_full = esphome::get_mac_address();
            std::string mac6 = (mac_full.size() >= 6) ? mac_full.substr(mac_full.size() - 6) : mac_full;
            if (esphome::App.is_name_add_mac_suffix_enabled() && !mac6.empty()) {
              static char s_hw_pass[24];
              snprintf(s_hw_pass, sizeof(s_hw_pass), "clock-%s", mac6.c_str());
              #if defined(USE_WEBSERVER_AUTH)
                if (esphome::web_server_base::global_web_server_base != nullptr) {
                  esphome::web_server_base::global_web_server_base->set_auth_password(s_hw_pass);
                }
              #endif
            }
            std::string url_s = "http://" + esphome::App.get_name() + ".local/";
            id(diag_web_url).publish_state(url_s);
            id(diag_hw_id).publish_state(world_clock::to_upper_ascii(mac6));

            float init_lat = !std::isnan(id(cfg_lat).state) ? id(cfg_lat).state : (float)${default_lat};
            float init_lon = !std::isnan(id(cfg_lon).state) ? id(cfg_lon).state : (float)${default_lon};
            id(active_lat) = init_lat;
            id(active_lon) = init_lon;
            world_clock::NetWorker::start(
                init_lat, init_lon,
                []() -> bool { return id(wifi_conn).is_connected(); },
                []() -> bool { return id(clock_time).utcnow().is_valid(); });

esp32:
  framework:
    sdkconfig_options:
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: "y"
      CONFIG_LWIP_MAX_SOCKETS: "18"

http_request:
  timeout: 5s

wifi:
  id: wifi_conn
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  reboot_timeout: 0s
  ap:
    ssid: "${display_name} Setup"
    password: !secret ap_password
    ap_timeout: 30s

captive_portal:

mdns:
  disabled: false

web_server:
  port: 80
  version: 3
  local: true
  auth:
    type: digest
    username: !secret web_auth_user
    password: !secret web_auth_pass
  sorting_groups:
    - { id: grp_controls, name: "1. Quick Controls", sorting_weight: 10 }
    - { id: grp_profile,  name: "2. Child Profile, Location & Units", sorting_weight: 20 }
    - { id: grp_schedule, name: "3. Sleep Schedule & Brightness", sorting_weight: 30 }
    - { id: grp_messages, name: "4. Custom Screen Wording ({name}, {quiet}, {bedtime})", sorting_weight: 40 }
    - { id: grp_holidays, name: "5. Occasions & Visual Features", sorting_weight: 50 }
    - { id: grp_diag,     name: "6. Device Diagnostics", sorting_weight: 90 }

ota:
  - platform: web_server
    on_begin:
      then:
        - component.update: device_prefs
        - script.execute: ota_splash_begin
    on_progress:
      then:
        - lambda: |-
            int pct = (int)x;
            if (pct >= id(last_ota_pct) + 5 || pct >= 99) {
              id(last_ota_pct) = pct;
              char obuf[48];
              snprintf(obuf, sizeof(obuf), "UPDATING CLOCK... %d%%", pct);
              lv_label_set_text(id(splash_title), obuf);
              lv_bar_set_value(id(splash_bar), pct, LV_ANIM_OFF);
              lv_timer_handler();
            }
    on_end:
      then:
        - script.execute: ota_splash_end
    on_error:
      then:
        - script.execute: ota_splash_error

time:
  - platform: sntp
    id: clock_time
    timezone: "${timezone}"
    servers:
      - time1.google.com
      - time2.google.com
      - time3.google.com
    on_time_sync:
      then:
        - lambda: 'id(force_redraw) = true;'

light:
  - id: !extend display_backlight
    web_server: { sorting_group_id: grp_controls, sorting_weight: 20 }

select:
  - id: !extend occasion_select
    web_server: { sorting_group_id: grp_controls, sorting_weight: 10 }

button:
  - platform: template
    name: "Sync Weather & ISS Now"
    id: sync_now_btn
    web_server: { sorting_group_id: grp_controls, sorting_weight: 30 }
    on_press:
      then:
        - lambda: '__atomic_store_n(&world_clock::standalone_telemetry().force_sync, true, __ATOMIC_RELEASE);'
  - platform: restart
    name: "Restart Clock"
    web_server: { sorting_group_id: grp_diag, sorting_weight: 90 }

switch:
