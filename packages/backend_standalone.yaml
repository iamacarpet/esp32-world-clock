script:
  - id: save_prefs_debounced
    mode: restart
    then:
      - delay: 5s
      - component.update: device_prefs

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE)) return;

          auto now = id(clock_time).now();
          auto utc = id(clock_time).utcnow();
          uint32_t now_ms = millis();
          if (!id(boot_grace_done) && now_ms >= 45000UL) id(boot_grace_done) = true;

          // 1. Contention-Safe Non-Blocking Core 0 Weather, ISS & Calendar Handoff (FreeRTOS mutex + std::atomic)
          auto &t = world_clock::standalone_telemetry();
          t.wifi_connected.store(id(wifi_conn).is_connected(), std::memory_order_release);
          t.time_valid.store(utc.is_valid(), std::memory_order_release);
          if (now.is_valid() && utc.is_valid()) {
            int64_t loc_min = world_clock::ymd_to_jdn(now.year, now.month, now.day_of_month) * 1440LL + now.hour * 60 + now.minute;
            int64_t utc_min = world_clock::ymd_to_jdn(utc.year, utc.month, utc.day_of_month) * 1440LL + utc.hour * 60 + utc.minute;
            t.local_utc_offset_min.store((int)(loc_min - utc_min), std::memory_order_relaxed);
          }

          static bool s_wx_ever = false;
          static uint32_t s_wx_stamp = 0;
          static uint32_t s_seen_iss_ms = 0;
          bool wx_changed = false;
          bool got_iss = false;
          std::string cal_diag_pub;
          float in_lat = 0.0f, in_lon = 0.0f;
          bool in_ecl = false;
          uint32_t iss_stamp = 0;

          if (t.try_lock()) {
            if (now.is_valid()) {
              t.loc_year = now.year;
              t.loc_month = now.month;
              t.loc_day = now.day_of_month;
            }
            s_wx_ever = t.wx_valid;
            s_wx_stamp = t.wx_ms;
            if (t.wx_dirty) {
              id(cur_wx_temp) = t.wx_temp;
              id(cur_wx_feels) = t.wx_feels;
              id(cur_wx_high) = t.wx_high;
              id(cur_wx_low) = t.wx_low;
              id(cur_wx_cond) = t.cond_buf;
              id(cur_wx_today_cond) = t.wx_today_cond_buf;
              id(cur_wx_precip_pct) = t.wx_today_precip_pct;
              id(cur_wx_3day) = t.forecast_3day_buf;
              t.wx_dirty = false;
              wx_changed = true;
            }
            if (t.iss_valid.load(std::memory_order_acquire) && t.iss_ms != s_seen_iss_ms) {
              in_lat = t.iss_lat;
              in_lon = t.iss_lon;
              in_ecl = t.iss_eclipsed;
              iss_stamp = t.iss_ms;
              got_iss = true;
            }
            if (t.cal_dirty) {
              id(fam_cal_summary) = t.family_cal;
              id(sch_cal_summary) = t.school_cal;
              id(cal_today_event) = t.family_cal.today_title;
              id(cal_tomorrow_event) = t.family_cal.tomorrow_title;
              id(cal_next_event) = t.family_cal.next_title;
              id(cal_next_days) = t.family_cal.next_days_away;
              id(cal_school_configured) = (t.school_cal_url[0] != '\0') || t.family_cal.today_is_school_holiday;
              id(cal_school_holiday) = t.school_cal.today_is_school_holiday || t.family_cal.today_is_school_holiday;
              id(cal_school_note) = (t.school_cal.school_note[0] != '\0') ? t.school_cal.school_note : t.family_cal.school_note;
              cal_diag_pub = t.cal_diag;
              t.cal_dirty = false;
              wx_changed = true;
            }
            t.unlock();
          }
          if (!cal_diag_pub.empty()) {
            id(diag_cal_status).publish_state(cal_diag_pub);
          }

          id(cur_wx_age_ok) = s_wx_ever && ((uint32_t)(now_ms - s_wx_stamp) <= 7200000UL);
          if (wx_changed) id(force_redraw) = true;

          if (got_iss) {
            if (id(iss_has_fix)) {
              float dt_s = (float)(iss_stamp - id(iss_fix_ms)) / 1000.0f;
              float dlon = in_lon - id(iss_cur_lon);
              if (dlon > 180.0f) dlon -= 360.0f;
              if (dlon < -180.0f) dlon += 360.0f;
              float dlat = in_lat - id(iss_cur_lat);
              if (dt_s >= 2.0f && dt_s <= 180.0f) {
                id(iss_vel_lat) = std::clamp(dlat / dt_s, -0.12f, 0.12f);
                id(iss_vel_lon) = std::clamp(dlon / dt_s, -0.02f, 0.14f);
              }
            } else {
              id(iss_vel_lat) = 0.0f;
              id(iss_vel_lon) = 0.060f;
            }
            s_seen_iss_ms = iss_stamp;
            id(iss_cur_lat) = in_lat;
            id(iss_cur_lon) = in_lon;
            id(iss_is_eclipsed) = in_ecl;
            id(iss_fix_ms) = iss_stamp;
            id(iss_has_fix) = true;
          }
          if (id(iss_has_fix) && (uint32_t)(now_ms - id(iss_fix_ms)) > 180000UL) {
            id(iss_has_fix) = false;
            world_clock::sprite_engine().reset_iss_smoothing();
          }

          // 2. Sync Live Web Settings into Core State
          std::string cname = id(cfg_child_name).state.empty() ? "${default_child_name}" : id(cfg_child_name).state;
          std::string cname_up = world_clock::to_upper_ascii(cname);
          std::string loc_up = world_clock::to_upper_ascii(id(cfg_loc_name).state.empty() ? "${default_location}" : id(cfg_loc_name).state);
          world_clock::utf8_truncate_codepoints(loc_up, 12);
          id(active_child_name) = cname;
          id(active_loc_name) = loc_up;
          id(active_birth_year) = (id(cfg_birthdate).year > 1900) ? (int)id(cfg_birthdate).year : ${default_birth_year};
          id(use_24h_clock) = id(cfg_use_24h).state;
          id(use_fahrenheit) = id(cfg_use_fahrenheit).state;
          id(use_miles) = id(cfg_use_miles).state;
          id(show_night_lights) = id(cfg_night_lights).state;
          id(keep_santa_winddown) = id(cfg_santa_winddown).state;
          std::string cp_opt = id(cfg_cal_priority).current_option();
          id(cal_priority_mode) = (cp_opt == "Today & Routine First") ? 1 : ((cp_opt == "Countdowns First") ? 2 : 0);
          std::string cs_opt = id(cfg_cal_style).current_option();
          id(cal_display_style) = (cs_opt == "Prominent Dock Card") ? 1 : ((cs_opt == "Morning Launchpad Takeover") ? 2 : 0);
          id(minimal_teen_mode) = (id(cfg_age_profile).current_option() == "Teen & Study Desk (12+)");
          id(launchpad_start_min) = (int)id(cfg_launchpad_start_time).hour * 60 + (int)id(cfg_launchpad_start_time).minute;
          id(school_leave_min) = (int)id(cfg_school_leave_time).hour * 60 + (int)id(cfg_school_leave_time).minute;
          id(launchpad_hide_delay_min) = (int)roundf(std::isnan(id(cfg_launchpad_hide_delay).state) ? 30.0f : id(cfg_launchpad_hide_delay).state);

          // 3. Rollover-Safe Boot Splash State Machine (Connecting -> AP Ready -> SNTP -> Info Hold -> Live)
          bool wifi_ok = id(wifi_conn).is_connected();
          bool time_ok = utc.is_valid();
          static bool s_wifi_was_down = false;
          static uint32_t s_wifi_down_ms = 0;
          static uint32_t s_ready_ms = 0;
          bool ap_ready = false;
          if (!wifi_ok) {
            if (!s_wifi_was_down) { s_wifi_down_ms = now_ms; s_wifi_was_down = true; }
            ap_ready = ((uint32_t)(now_ms - s_wifi_down_ms) >= 15000UL);
          } else {
            s_wifi_was_down = false;
          }

          // In universal MAC-suffixed release mode, briefly hold the connected info splash (4s)
          // ONLY during daytime/evening — on a midnight power cut during Deep Sleep, skip the hold
          // and drop straight to dim Red Sleep mode immediately!
          bool mac_mode = esphome::App.is_name_add_mac_suffix_enabled();
          bool info_hold = false;
          if (!id(boot_complete) && wifi_ok && time_ok && mac_mode) {
            bool is_deep_night = now.is_valid() && (now.hour >= 22 || now.hour < 6);
            if (!is_deep_night) {
              if (s_ready_ms == 0) s_ready_ms = now_ms;
              info_hold = ((uint32_t)(now_ms - s_ready_ms) < 4000UL);
            }
          }

          uint8_t next_st = 4;
          if (!id(boot_complete)) {
            if (!wifi_ok) next_st = ap_ready ? 3 : 1;
            else if (!time_ok || info_hold) next_st = 2;
            else next_st = 4;
          } else if (${fullscreen_watchdog} && !wifi_ok) {
            next_st = ap_ready ? 3 : 1;
          }

          if (next_st != id(overlay_state) || (next_st == 2 && !id(boot_complete))) {
            id(overlay_state) = next_st;
            if (next_st != 4) {
              #if LVGL_VERSION_MAJOR >= 9
                lv_obj_remove_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
              #else
                lv_obj_clear_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
              #endif
              std::string kick = cname_up + "'S WORLD & SPACE CLOCK";
              lv_label_set_text(id(splash_kicker), kick.c_str());
              std::string dev_host = esphome::App.get_name();
              std::string mac_full = esphome::get_mac_address();
              std::string mac6 = (mac_full.size() >= 6) ? mac_full.substr(mac_full.size() - 6) : mac_full;
              if (next_st == 1) {
                lv_obj_add_flag(id(splash_qr_box), LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(id(splash_title), "CONNECTING TO WI-FI...");
                lv_label_set_text(id(splash_sub), "Step 1/2  \u2192  Joining Home Wi-Fi");
                lv_label_set_text(id(splash_hint), mac_mode ? ("Device ID: " + dev_host).c_str() : "");
                lv_bar_set_value(id(splash_bar), 38, LV_ANIM_OFF);
              } else if (next_st == 3) {
                lv_label_set_text(id(splash_title), "SCAN QR TO SET UP WI-FI");
                std::string ap_ssid = mac_mode ? dev_host : "${display_name} Setup";
                std::string ap_line = mac_mode
                    ? ("Wi-Fi: " + ap_ssid + "  ·  PW: ClockSetup123")
                    : "Join '${display_name} Setup' (See Setup Card)";
                lv_label_set_text(id(splash_sub), ap_line.c_str());
                lv_label_set_text(id(splash_hint), "Scan QR with phone camera, then pick Home Wi-Fi");
                lv_bar_set_value(id(splash_bar), 50, LV_ANIM_OFF);
                if (mac_mode) {
                  std::string qr_wifi = "WIFI:T:WPA;S:" + ap_ssid + ";P:ClockSetup123;;";
                  lv_qrcode_update(id(splash_qr), qr_wifi.c_str(), qr_wifi.size());
                  #if LVGL_VERSION_MAJOR >= 9
                    lv_obj_remove_flag(id(splash_qr_box), LV_OBJ_FLAG_HIDDEN);
                  #else
                    lv_obj_clear_flag(id(splash_qr_box), LV_OBJ_FLAG_HIDDEN);
                  #endif
                }
              } else {
                lv_label_set_text(id(splash_title), time_ok ? "CLOCK READY!" : "SYNCING GOOGLE TIME...");
                std::string ip_s = id(wifi_ip_str).has_state() ? id(wifi_ip_str).state : "";
                std::string url_s = "http://" + dev_host + ".local/";
                std::string sub_s = url_s;
                if (!ip_s.empty()) sub_s += "  ·  " + ip_s;
                lv_label_set_text(id(splash_sub), sub_s.c_str());
                std::string hint_s = (mac_mode && !id(active_web_pass).empty())
                    ? ("Scan QR or visit URL · Login: parent / " + id(active_web_pass))
                    : "Scan QR with phone camera to open Settings";
                lv_label_set_text(id(splash_hint), hint_s.c_str());
                lv_bar_set_value(id(splash_bar), time_ok ? 100 : 82, LV_ANIM_OFF);
                lv_qrcode_update(id(splash_qr), url_s.c_str(), url_s.size());
                #if LVGL_VERSION_MAJOR >= 9
                  lv_obj_remove_flag(id(splash_qr_box), LV_OBJ_FLAG_HIDDEN);
                #else
                  lv_obj_clear_flag(id(splash_qr_box), LV_OBJ_FLAG_HIDDEN);
                #endif
              }
            }
          }

          if (!id(boot_complete)) {
            if (wifi_ok && time_ok && !info_hold) {
              id(boot_complete) = true;
              id(force_redraw) = true;
              lv_obj_add_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
            } else {
              return;
            }
          } else if (next_st == 4) {
            lv_obj_add_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
          }

          // 4. Daily Min/Max RAM Fallback + Dynamic Token Resolution
          float cur_t = id(cur_wx_temp);
          if (now.is_valid() && !std::isnan(cur_t)) {
            if (id(tracked_yday) != now.day_of_year) {
              id(tracked_yday) = now.day_of_year;
              id(tracked_high) = cur_t;
              id(tracked_low) = cur_t;
            } else {
              if (cur_t > id(tracked_high)) id(tracked_high) = cur_t;
              if (cur_t < id(tracked_low)) id(tracked_low) = cur_t;
            }
          }

          const bool use24 = id(use_24h_clock);
          world_clock::TokenContext tctx{
              cname_up,
              world_clock::format_short_time((int)id(cfg_winddown_time).hour, (int)id(cfg_winddown_time).minute, use24),
              world_clock::format_short_time((int)id(cfg_bedtime).hour, (int)id(cfg_bedtime).minute, use24),
              world_clock::format_short_time((int)id(cfg_quiet_time).hour, (int)id(cfg_quiet_time).minute, use24),
              world_clock::format_short_time((int)id(cfg_wakeup_time).hour, (int)id(cfg_wakeup_time).minute, use24),
          };
          auto resolve_msg = [&](const std::string &raw, const char *fallback) -> std::string {
            return world_clock::expand_tokens(raw.empty() ? fallback : raw, tctx);
          };
          id(msg_sleep_title_resolved)    = resolve_msg(id(cfg_msg_sleep_title).state, "BEFORE {quiet} · SLEEP TIME");
          id(msg_sleep_sub_resolved)      = resolve_msg(id(cfg_msg_sleep_sub).state, "Can't sleep? Wake Mum & Dad");
          id(msg_quiet_title_resolved)    = resolve_msg(id(cfg_msg_quiet_title).state, "PAST {quiet} · OK TO GET UP");
          id(msg_quiet_sub_resolved)      = resolve_msg(id(cfg_msg_quiet_sub).state, "Quiet play in your room OK!");
          id(msg_winddown_title_resolved) = resolve_msg(id(cfg_msg_winddown_title).state, "TIME TO GET READY FOR BED");
          id(msg_winddown_sub_resolved)   = resolve_msg(id(cfg_msg_winddown_sub).state, "PJs, teeth & story · Bed {bedtime}");
          id(msg_xmas_title_resolved)     = resolve_msg(id(cfg_msg_xmas_title).state, "MERRY CHRISTMAS!");
          id(msg_xmas_sub_resolved)       = resolve_msg(id(cfg_msg_xmas_sub).state, "Time for presents, {name}!");

          // 5. 4-Phase Schedule (Symmetric School-Night Bedtime + Weekend/Holiday Lie-In + Focus Pomodoro + Launchpad)
          world_clock::ScheduleConfig scfg;
          scfg.winddown_enabled = id(cfg_winddown_en).state;
          scfg.sleep_enabled = id(cfg_sleep_en).state;
          scfg.quiet_enabled = id(cfg_quiet_en).state;
          scfg.weekend_liein_enabled = id(cfg_weekend_en).state;
          scfg.non_school_bedtime_enabled = id(cfg_late_bed_en).state;
          scfg.winddown_m = (int)id(cfg_winddown_time).hour * 60 + (int)id(cfg_winddown_time).minute;
          scfg.bedtime_m  = (int)id(cfg_bedtime).hour       * 60 + (int)id(cfg_bedtime).minute;
          scfg.quiet_m    = (int)id(cfg_quiet_time).hour    * 60 + (int)id(cfg_quiet_time).minute;
          scfg.wakeup_m   = (int)id(cfg_wakeup_time).hour   * 60 + (int)id(cfg_wakeup_time).minute;
          scfg.special_delay_m = (int)roundf(std::isnan(id(cfg_special_delay).state) ? 0.0f : id(cfg_special_delay).state);
          scfg.weekend_offset_m = (int)roundf(std::isnan(id(cfg_weekend_offset).state) ? 0.0f : id(cfg_weekend_offset).state);
          scfg.non_school_bedtime_m = (int)roundf(std::isnan(id(cfg_late_bed_offset).state) ? 0.0f : id(cfg_late_bed_offset).state);

          // Auto-clear Parent Note at midnight & Tooth Fairy at noon next day
          if (now.is_valid()) {
            if (!id(parent_note_text).empty() && id(parent_note_yday) >= 0 && now.day_of_year != id(parent_note_yday)) {
              id(parent_note_text).clear();
              id(parent_note_yday) = -1;
            }
            if (id(tooth_fairy_active) && now.hour == 12 && now.minute == 0 && now.second < 3) {
              id(tooth_fairy_active) = false;
              id(cfg_tooth_fairy).publish_state(false);
            }
            if (id(winddown_override_yday) >= 0 && now.day_of_year != id(winddown_override_yday)) {
              id(winddown_override_yday) = -1;
            }
          }

          // Check Nap Timer expiration
          if (id(nap_end_ms) != 0 && (int32_t)(now_ms - id(nap_end_ms)) >= 0) {
            id(nap_end_ms) = 0;
            id(force_redraw) = true;
          }

          // Check Focus Pomodoro expiration & live countdown update
          static int s_last_focus_stars = -1;
          if (id(focus_end_ms) != 0 && (int32_t)(now_ms - id(focus_end_ms)) >= 0) {
            id(focus_end_ms) = 0;
            id(focus_rem_01) = -1.0f;
            s_last_focus_stars = -1;
            id(force_redraw) = true;
          }

          int cur_min = now.is_valid() ? (now.hour * 60 + now.minute) : 720;
          int dow_now = now.is_valid() ? world_clock::ymd_dow_num(now.year, now.month, now.day_of_month) : 1;
          bool is_weekend = (dow_now == 0 || dow_now == 6);
          bool is_today_non_school = is_weekend || (id(cfg_holiday_liein_en).state && id(cal_school_holiday));
          bool is_tmrw_hol = id(sch_cal_summary).tomorrow_is_school_holiday || id(fam_cal_summary).tomorrow_is_school_holiday;
          bool is_tomorrow_non_school = (dow_now == 5 || dow_now == 6) || (id(cfg_holiday_liein_en).state && is_tmrw_hol);
          bool is_special_today = now.is_valid() && world_clock::is_special_night_ymd(now.month, now.day_of_month);
          bool is_special_yest = false;
          if (now.is_valid()) {
            int yy = 0, ym = 0, yd = 0;
            world_clock::jdn_to_ymd(world_clock::ymd_to_jdn(now.year, now.month, now.day_of_month) - 1, yy, ym, yd);
            is_special_yest = world_clock::is_special_night_ymd(ym, yd);
          }

          // Update dynamic token times with active overnight cycle times (noon-split -> zero jump at midnight!)
          int eff_wd  = world_clock::effective_cycle_winddown_m(cur_min, scfg, is_special_today, is_today_non_school, is_tomorrow_non_school, is_special_yest);
          int eff_bed = world_clock::effective_cycle_bedtime_m(cur_min, scfg, is_special_today, is_today_non_school, is_tomorrow_non_school, is_special_yest);
          int eff_q   = world_clock::effective_cycle_quiet_m(cur_min, scfg, is_today_non_school, is_tomorrow_non_school);
          int eff_w   = world_clock::effective_cycle_wakeup_m(cur_min, scfg, is_today_non_school, is_tomorrow_non_school);
          id(eff_wakeup_min_today) = world_clock::effective_wakeup_m(scfg, is_today_non_school);
          tctx.winddown = world_clock::format_short_time(eff_wd / 60, eff_wd % 60, use24);
          tctx.bedtime  = world_clock::format_short_time(eff_bed / 60, eff_bed % 60, use24);
          tctx.quiet    = world_clock::format_short_time(eff_q / 60, eff_q % 60, use24);
          tctx.wakeup   = world_clock::format_short_time(eff_w / 60, eff_w % 60, use24);
          id(msg_winddown_sub_resolved) = resolve_msg(id(cfg_msg_winddown_sub).state, "PJs, teeth & story · Bed {bedtime}");
          id(msg_sleep_title_resolved)  = resolve_msg(id(cfg_msg_sleep_title).state, "BEFORE {quiet} · SLEEP TIME");
          id(msg_quiet_title_resolved)  = resolve_msg(id(cfg_msg_quiet_title).state, "PAST {quiet} · OK TO GET UP");

          int b_mon = (id(cfg_birthdate).month >= 1) ? (int)id(cfg_birthdate).month : 1;
          int b_day = (id(cfg_birthdate).day >= 1)   ? (int)id(cfg_birthdate).day   : 1;

          std::string sel = id(occasion_select).current_option();
          uint8_t slp = 0;
          uint8_t mode = 1;
          float rem_stars = -1.0f;

          if (sel == "Sleep Preview (Red)") {
            slp = 1; mode = 0; rem_stars = 0.65f;
          } else if (sel == "Quiet Play Preview (Amber)") {
            slp = 2; mode = 0;
          } else if (sel == "Wind-Down Preview (Amber)") {
            slp = 3; mode = (now.is_valid() && now.month == 12 && now.day_of_month == 24) ? 4 : 0; rem_stars = 0.75f;
          } else if (sel == "Morning Launchpad Preview" || sel == "No-School Holiday Preview" || sel == "Focus Study Timer Preview") {
            slp = 0; mode = id(cfg_iss_en).state ? 1 : 0;
          } else if (sel != "Auto") {
            slp = 0;
            if (sel == "Classic Map") mode = 0;
            else if (sel == "ISS Space Tracker") mode = 1;
            else if (sel == "Birthday Mode") mode = 2;
            else if (sel == "Christmas Advent") mode = 3;
            else if (sel == "Christmas Day") mode = 9;
            else if (sel == "Santa Tracker") mode = 4;
            else if (sel == "Halloween") mode = 5;
            else if (sel == "Easter Egg Hunt") mode = 6;
            else if (sel == "Fireworks") mode = 7;
            else if (sel == "Star Wars Day") mode = 8;
          } else if (now.is_valid()) {
            int m = now.month, d = now.day_of_month, yr = now.year;
            slp = world_clock::evaluate_schedule(cur_min, scfg, is_special_today, is_today_non_school, is_tomorrow_non_school, is_special_yest);

            if (id(nap_end_ms) != 0) {
              slp = 1;
              uint32_t rem_ms = (uint32_t)(id(nap_end_ms) - now_ms);
              rem_stars = (id(nap_total_ms) > 0) ? std::clamp((float)rem_ms / (float)id(nap_total_ms), 0.0f, 1.0f) : 0.5f;
            } else {
              if (id(winddown_override_yday) == now.day_of_year) {
                if (slp == 0) slp = 3;
                else if (slp == 1) id(winddown_override_yday) = -1;
              }
              if (slp == 1 || slp == 3) {
                rem_stars = world_clock::sleep_phase_remaining_01(cur_min, slp, scfg, is_special_today, is_today_non_school, is_tomorrow_non_school, is_special_yest);
              }
            }

            bool hol_en = id(cfg_holidays_en).state && !id(minimal_teen_mode);
            if (!id(minimal_teen_mode) && m == b_mon && d == b_day) mode = 2;
            else if (hol_en && m == 12 && d == 25) mode = 9;
            else if (hol_en && m == 12 && d == 24) mode = 4;
            else if (hol_en && m == 12 && d < 24) mode = 3;
            else if (hol_en && m == 10 && d == 31) mode = 5;
            else if (hol_en && ((m == 11 && d == 5) || (m == 12 && d == 31) || (m == 1 && d == 1))) mode = 7;
            else if (hol_en && m == 5 && d == 4) mode = 8;
            else if (hol_en && world_clock::is_easter_window(yr, m, d)) mode = 6;
            else mode = id(cfg_iss_en).state ? 1 : 0;
          }
          id(sleep_remaining_01) = id(cfg_sleep_stars_en).state ? rem_stars : -1.0f;
          static int s_last_sleep_stars = -1;
          int sleep_stars_now = (id(sleep_remaining_01) >= 0.0f) ? (int)ceilf(id(sleep_remaining_01) * 5.0f) : -1;
          bool dock_stars_dirty = false;
          if (sleep_stars_now != s_last_sleep_stars) {
            s_last_sleep_stars = sleep_stars_now;
            dock_stars_dirty = true;
          }

          // Sync custom UI countdown into shared globals so Morning Launchpad displays it too!
          id(active_cd_name) = id(cfg_countdown_name).state;
          if (now.is_valid() && !id(active_cd_name).empty() && id(cfg_countdown_date).year > 2020) {
            id(active_cd_days) = world_clock::days_between_ymd(
                now.year, now.month, now.day_of_month,
                (int)id(cfg_countdown_date).year, (int)id(cfg_countdown_date).month, (int)id(cfg_countdown_date).day);
          } else {
            id(active_cd_days) = -1;
          }

          // Focus Pomodoro state (live timer OR Focus Study Timer Preview)
          if (id(focus_end_ms) != 0) {
            uint32_t rem_ms = (uint32_t)(id(focus_end_ms) - now_ms);
            int rem_s = (int)(rem_ms / 1000UL);
            char ft[40];
            snprintf(ft, sizeof(ft), "%s · %02d:%02d LEFT", id(focus_is_break) ? "BREAK TIME" : "FOCUS STUDY", rem_s / 60, rem_s % 60);
            id(focus_title) = ft;
            id(focus_sub) = id(focus_is_break) ? "Stretch & recharge · Back soon!" : "Stay in flow · 5m break next";
            id(focus_rem_01) = (id(focus_total_ms) > 0) ? std::clamp((float)rem_ms / (float)id(focus_total_ms), 0.0f, 1.0f) : 0.5f;
            int stars_now = (int)ceilf(id(focus_rem_01) * 5.0f);
            if (stars_now != s_last_focus_stars) { s_last_focus_stars = stars_now; dock_stars_dirty = true; }
          } else if (sel == "Focus Study Timer Preview") {
            id(focus_is_break) = false;
            id(focus_title) = "FOCUS STUDY · 24:35 LEFT";
            id(focus_sub) = "Stay in flow · 5m break next";
            id(focus_rem_01) = 0.85f;
            if (s_last_focus_stars != 99) { s_last_focus_stars = 99; dock_stars_dirty = true; }
          } else {
            if (id(focus_rem_01) >= 0.0f) { id(focus_rem_01) = -1.0f; s_last_focus_stars = -1; dock_stars_dirty = true; }
          }

          // Morning Launchpad Takeover respects Sleep/Quiet Play (slp == 0), starts at Launchpad Start Time,
          // and stays visible for `launchpad_hide_delay_min` minutes past Leave for School Time (e.g. 08:30 + 30m = 09:00!)
          bool has_today_ev = id(fam_cal_summary).today_timed[0].valid || (id(fam_cal_summary).today_allday[0] != '\0') ||
                              id(sch_cal_summary).today_timed[0].valid || (id(sch_cal_summary).today_allday[0] != '\0') ||
                              !id(parent_note_text).empty();
          int lp_start_m = id(launchpad_start_min);
          int lp_end_m = id(school_leave_min) + std::clamp(id(launchpad_hide_delay_min), 0, 120);
          bool auto_lp = (id(cal_display_style) == 2) && (slp == 0) && (mode <= 1 || mode == 3) &&
                         now.is_valid() && (cur_min >= lp_start_m && cur_min <= lp_end_m) &&
                         (!is_weekend || has_today_ev);
          bool want_lp = auto_lp || (sel == "Morning Launchpad Preview") || (sel == "No-School Holiday Preview");
          if (want_lp != id(launchpad_visible)) {
            id(launchpad_visible) = want_lp;
            if (!want_lp) id(badge_mode_applied) = 255;
          }

          uint8_t pal = (slp == 1) ? 1 : ((slp == 2 || slp == 3) ? 2 : 0);
          bool mode_changed = (slp != id(sleep_phase)) || (mode != id(active_occasion));
          bool changed = mode_changed || id(force_redraw);
          if (mode_changed) {
            id(badge_mode_applied) = 255;
            if (mode != 4) id(santa_wp_idx) = -1;
          }
          id(sleep_phase) = slp;
          id(ui_palette) = pal;
          id(active_occasion) = mode;
          t.sleep_phase.store(slp, std::memory_order_release);
          t.active_occasion.store(mode, std::memory_order_release);
          if (changed) {
            id(force_redraw) = false;
            id(applied_palette) = 255;
          } else if (dock_stars_dirty) {
            // Instant star transition on dock_canvas without re-rendering the 800x322 world map!
            id(render_dock).execute();
          }

      - if:
          condition:
            lambda: 'return id(boot_complete) && !__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE) && id(applied_palette) != id(ui_palette);'
          then:
            - script.execute: apply_shell_palette

      # 4-Phase Automatic Circadian Backlight Dimming
      - if:
          condition:
            lambda: 'return id(boot_complete) && !__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE) && id(applied_backlight_phase) != id(sleep_phase);'
          then:
            - lambda: 'id(applied_backlight_phase) = id(sleep_phase);'
            - if:
                condition:
                  lambda: 'return id(sleep_phase) == 1;'
                then:
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return std::clamp(id(cfg_sleep_bright).state / 100.0f, 0.05f, 1.0f);'
                      transition_length: 1500ms
            - if:
                condition:
                  lambda: 'return id(sleep_phase) == 2;'
                then:
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return std::clamp(id(cfg_quiet_bright).state / 100.0f, 0.05f, 1.0f);'
                      transition_length: 1500ms
            - if:
                condition:
                  lambda: 'return id(sleep_phase) == 3;'
                then:
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return std::clamp(id(cfg_winddown_bright).state / 100.0f, 0.10f, 1.0f);'
                      transition_length: 1500ms
            - if:
                condition:
                  lambda: 'return id(sleep_phase) == 0;'
                then:
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return std::clamp(id(cfg_day_bright).state / 100.0f, 0.15f, 1.0f);'
                      transition_length: 1500ms

      # Status Icons, Clock, Date, Ticker & Dock 1Hz Update
      - lambda: |-
          if (__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE)) return;

          // Wi-Fi icon
          bool w_ok = id(wifi_conn).is_connected();
          if (w_ok) {
            float rssi = id(wifi_rssi).state;
            const char *wico = (std::isnan(rssi) || rssi >= -55.0f) ? "\U000F0928"
                             : ((rssi >= -67.0f) ? "\U000F0925" : ((rssi >= -77.0f) ? "\U000F0922" : "\U000F091F"));
            lv_label_set_text(id(wifi_icon_label), wico);
            lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex((id(ui_palette) == 0) ? 0x787882 : 0x7A1812), 0);
          } else {
            lv_label_set_text(id(wifi_icon_label), "\U000F05AA");
            lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0xE84A18), 0);
          }

          // Cloud Sync icon
          bool iss_ok = (id(active_occasion) != 1 || id(sleep_phase) != 0 || id(iss_has_fix));
          bool sync_busy = world_clock::standalone_telemetry().sync_busy.load(std::memory_order_acquire);
          if (!w_ok || (id(boot_grace_done) && !id(cur_wx_age_ok))) {
            lv_label_set_text(id(sync_icon_label), "\U000F0164");
            lv_obj_set_style_text_color(id(sync_icon_label), lv_color_hex(0xE84A18), 0);
          } else if (sync_busy || !id(cur_wx_age_ok) || !iss_ok) {
            lv_label_set_text(id(sync_icon_label), "\U000F063F");
            lv_obj_set_style_text_color(id(sync_icon_label), lv_color_hex((id(ui_palette) == 0) ? 0xFFB830 : 0x9E141C), 0);
          } else {
            lv_label_set_text(id(sync_icon_label), "\U000F0160");
            lv_obj_set_style_text_color(id(sync_icon_label), lv_color_hex((id(ui_palette) == 0) ? 0x787882 : 0x7A1812), 0);
          }

          if (!id(boot_complete)) return;

          auto now = id(clock_time).now();
          const bool use24 = id(use_24h_clock);
          const bool use_mi = id(use_miles);
          std::string cname = world_clock::to_upper_ascii(id(active_child_name));
          std::string loc = id(active_loc_name);

          static std::string s_last_date, s_last_loc;
          bool relayout_hdr = false;
          if (now.is_valid()) {
            char cbuf[24];
            if (use24) {
              snprintf(cbuf, sizeof(cbuf), "%02d\u2236%02d\u2236%02d", now.hour, now.minute, now.second);
              lv_obj_add_flag(id(ampm_label), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(id(clock_label), -42);
            } else {
              int hr12 = now.hour % 12;
              if (hr12 == 0) hr12 = 12;
              snprintf(cbuf, sizeof(cbuf), "%d\u2236%02d\u2236%02d", hr12, now.minute, now.second);
              #if LVGL_VERSION_MAJOR >= 9
                lv_obj_remove_flag(id(ampm_label), LV_OBJ_FLAG_HIDDEN);
              #else
                lv_obj_clear_flag(id(ampm_label), LV_OBJ_FLAG_HIDDEN);
              #endif
              lv_obj_set_x(id(clock_label), -84);
              lv_label_set_text(id(ampm_label), (now.hour >= 12) ? "PM" : "AM");
            }
            lv_label_set_text(id(clock_label), cbuf);

            char dbuf[48];
            now.strftime(dbuf, sizeof(dbuf), "%A, %d %b %Y");
            if (s_last_date != dbuf) {
              s_last_date = dbuf;
              lv_label_set_text(id(date_label), dbuf);
              relayout_hdr = true;
            }
          }

          if (s_last_loc != loc) {
            s_last_loc = loc;
            lv_label_set_text(id(loc_label), loc.c_str());
            relayout_hdr = true;
          }
          if (relayout_hdr) {
            lv_obj_set_size(id(loc_pill), LV_SIZE_CONTENT, LV_SIZE_CONTENT);
            lv_obj_update_layout(lv_obj_get_parent(id(date_label)));
            lv_obj_align_to(id(loc_pill), id(date_label), LV_ALIGN_OUT_RIGHT_MID, 10, 0);
          }

          world_clock::ScheduleConfig scfg_t;
          scfg_t.weekend_liein_enabled = id(cfg_weekend_en).state;
          scfg_t.non_school_bedtime_enabled = id(cfg_late_bed_en).state;
          scfg_t.winddown_m = (int)id(cfg_winddown_time).hour * 60 + (int)id(cfg_winddown_time).minute;
          scfg_t.bedtime_m  = (int)id(cfg_bedtime).hour       * 60 + (int)id(cfg_bedtime).minute;
          scfg_t.quiet_m    = (int)id(cfg_quiet_time).hour    * 60 + (int)id(cfg_quiet_time).minute;
          scfg_t.wakeup_m   = (int)id(cfg_wakeup_time).hour   * 60 + (int)id(cfg_wakeup_time).minute;
          scfg_t.special_delay_m = (int)roundf(std::isnan(id(cfg_special_delay).state) ? 0.0f : id(cfg_special_delay).state);
          scfg_t.weekend_offset_m = (int)roundf(std::isnan(id(cfg_weekend_offset).state) ? 0.0f : id(cfg_weekend_offset).state);
          scfg_t.non_school_bedtime_m = (int)roundf(std::isnan(id(cfg_late_bed_offset).state) ? 0.0f : id(cfg_late_bed_offset).state);
          int now_m_cv = now.is_valid() ? (now.hour * 60 + now.minute) : 720;
          int dow_t = now.is_valid() ? world_clock::ymd_dow_num(now.year, now.month, now.day_of_month) : 1;
          bool is_wknd = (dow_t == 0 || dow_t == 6);
          bool is_today_ns_t = is_wknd || (id(cfg_holiday_liein_en).state && id(cal_school_holiday));
          bool is_tmrw_ns_t = (dow_t == 5 || dow_t == 6) || (id(cfg_holiday_liein_en).state && (id(sch_cal_summary).tomorrow_is_school_holiday || id(fam_cal_summary).tomorrow_is_school_holiday));
          bool is_spec_t = now.is_valid() && world_clock::is_special_night_ymd(now.month, now.day_of_month);
          bool is_spec_y = false;
          if (now.is_valid()) {
            int yy = 0, ym = 0, yd = 0;
            world_clock::jdn_to_ymd(world_clock::ymd_to_jdn(now.year, now.month, now.day_of_month) - 1, yy, ym, yd);
            is_spec_y = world_clock::is_special_night_ymd(ym, yd);
          }
          int ew_t = world_clock::effective_cycle_winddown_m(now_m_cv, scfg_t, is_spec_t, is_today_ns_t, is_tmrw_ns_t, is_spec_y);
          int eb_t = world_clock::effective_cycle_bedtime_m(now_m_cv, scfg_t, is_spec_t, is_today_ns_t, is_tmrw_ns_t, is_spec_y);
          int eq_t = world_clock::effective_cycle_quiet_m(now_m_cv, scfg_t, is_today_ns_t, is_tmrw_ns_t);
          int eu_t = world_clock::effective_cycle_wakeup_m(now_m_cv, scfg_t, is_today_ns_t, is_tmrw_ns_t);
          world_clock::TokenContext tctx{
              cname,
              world_clock::format_short_time(ew_t / 60, ew_t % 60, use24),
              world_clock::format_short_time(eb_t / 60, eb_t % 60, use24),
              world_clock::format_short_time(eq_t / 60, eq_t % 60, use24),
              world_clock::format_short_time(eu_t / 60, eu_t % 60, use24),
          };
          auto resolve_msg = [&](const std::string &raw, const char *fallback) -> std::string {
            return world_clock::expand_tokens(raw.empty() ? fallback : raw, tctx);
          };

          uint8_t slp = id(sleep_phase);
          uint8_t m = id(active_occasion);
          int b_mon = (id(cfg_birthdate).month >= 1) ? (int)id(cfg_birthdate).month : 1;
          int b_day = (id(cfg_birthdate).day >= 1)   ? (int)id(cfg_birthdate).day   : 1;
          int wake_m = id(eff_wakeup_min_today);
          bool alt_slot = now.is_valid() && (((now.second / 12) % 2) == 0);
          std::string tick = "CLASSIC WORLD DAY/NIGHT MAP";

          // Build calm routine / calendar / countdown headline + Prominent Dock Card via multi-event priority engine
          auto cv = world_clock::build_calendar_view(
              id(fam_cal_summary), id(sch_cal_summary),
              id(cal_school_configured), is_wknd, now_m_cv,
              id(cal_priority_mode), (now.is_valid() ? now.second / 12 : 0),
              use24, id(active_cd_name), id(active_cd_days));

          bool want_prom = (id(cal_display_style) == 1) && (slp == 0) && (id(focus_rem_01) < 0.0f) &&
                           (!cv.dock_title.empty() || !id(parent_note_text).empty());
          if (want_prom != id(cal_prominent_active)) {
            id(cal_prominent_active) = want_prom;
            id(force_redraw) = true;
          }
          if (want_prom) {
            id(cal_prominent_title) = !id(parent_note_text).empty() ? "PARENT NOTE" : cv.dock_title;
            id(cal_prominent_sub)   = !id(parent_note_text).empty() ? id(parent_note_text) : cv.dock_sub;
          }

          std::string routine_line;
          if (!id(parent_note_text).empty()) {
            routine_line = "NOTE  \u2192  " + world_clock::to_upper_ascii(id(parent_note_text));
          } else if (!cv.headline.empty()) {
            routine_line = cv.headline;
          } else if (now.is_valid() && id(cfg_holidays_en).state && !id(minimal_teen_mode)) {
            if (world_clock::is_pancake_day(now.year, now.month, now.day_of_month)) routine_line = "HAPPY PANCAKE DAY!";
            else if (world_clock::is_uk_mothers_day(now.year, now.month, now.day_of_month)) routine_line = "HAPPY MOTHER'S DAY!";
            else if (world_clock::is_fathers_day(now.year, now.month, now.day_of_month)) routine_line = "HAPPY FATHER'S DAY!";
            else if (world_clock::is_world_book_day(now.year, now.month, now.day_of_month)) routine_line = "HAPPY WORLD BOOK DAY!";
            else if (world_clock::is_meteor_shower(now.month, now.day_of_month)) routine_line = "METEOR SHOWER TONIGHT · WATCH THE SKY!";
            else if (world_clock::solstice_kind(now.month, now.day_of_month) == 1) routine_line = "SUMMER SOLSTICE · LONGEST DAY OF THE YEAR!";
            else if (world_clock::solstice_kind(now.month, now.day_of_month) == 2) routine_line = "WINTER SOLSTICE · SHORTEST DAY OF THE YEAR!";
          }

          if (slp == 1) {
            tick = (id(nap_end_ms) != 0) ? "NAP TIME  ·  QUIET REST UNTIL STARS FADE"
                                         : resolve_msg(id(cfg_msg_sleep_tick).state, "SLEEP TIME · BEFORE {quiet} \u2192 STAY IN BED");
          } else if (slp == 2) {
            tick = resolve_msg(id(cfg_msg_quiet_tick).state, "PAST {quiet} · QUIET PLAY IN YOUR ROOM OK");
          } else if (slp == 3) {
            if (m == 4 && id(keep_santa_winddown) && id(santa_wp_idx) >= 0) {
              char sw[64];
              snprintf(sw, sizeof(sw), "SANTA \u2192 %s · GET READY FOR BED!", id(santa_city).c_str());
              tick = sw;
            } else if (id(tooth_fairy_active)) {
              tick = "SHHH... TOOTH FAIRY TONIGHT! · BED " + tctx.bedtime;
            } else if (alt_slot && !id(cal_tomorrow_event).empty()) {
              tick = "TOMORROW \u2192 " + world_clock::to_upper_ascii(id(cal_tomorrow_event));
            } else {
              tick = resolve_msg(id(cfg_msg_winddown_tick).state, "BEDTIME AT {bedtime} \u2192 GET READY FOR BED!");
            }
          } else if (!id(parent_note_text).empty()) {
            tick = routine_line;
          } else if (m == 1) {
            if (!id(iss_has_fix)) {
              tick = routine_line.empty() ? "ISS RADAR  \u2192  SYNCING LIVE ORBITAL FEED..." : routine_line;
            } else {
              float ilat = id(iss_cur_lat), ilon = id(iss_cur_lon);
              float dist_iss = world_clock::haversine_km(id(active_lat), id(active_lon), ilat, ilon);
              const char *reg = "PACIFIC OCEAN";
              if (ilon >= -130.0f && ilon < -32.0f) {
                reg = (ilat >= 12.0f && ilon < -52.0f) ? "NORTH AMERICA" : ((ilat < 12.0f && ilon >= -84.0f) ? "SOUTH AMERICA" : "ATLANTIC OCEAN");
              } else if (ilon >= -32.0f && ilon < -12.0f) {
                reg = "ATLANTIC OCEAN";
              } else if (ilon >= -12.0f && ilon < 48.0f) {
                reg = (ilat >= 35.0f) ? "UK & EUROPE" : ((ilat >= -36.0f) ? "AFRICA" : "SOUTHERN OCEAN");
              } else if (ilon >= 48.0f && ilon < 105.0f) {
                reg = (ilat >= 5.0f) ? "ASIA" : "INDIAN OCEAN";
              } else if (ilon >= 105.0f && ilon < 165.0f) {
                reg = (ilat >= 8.0f) ? "EAST ASIA" : "AUSTRALIA";
              }

              int now_m = now.is_valid() ? (now.hour * 60 + now.minute) : -999;
              int bday_sleeps = (!id(minimal_teen_mode) && now.is_valid())
                                    ? world_clock::days_until_next_birthday(now.year, now.month, now.day_of_month, b_mon, b_day)
                                    : -1;
              if (dist_iss < 900.0f) {
                tick = std::string("ISS OVERHEAD NEAR ") + loc + "! WAVE AT ASTRONAUTS!";
              } else if (alt_slot && !routine_line.empty()) {
                tick = routine_line;
              } else if (now.is_valid() && now_m >= wake_m && now_m < wake_m + 45) {
                tick = resolve_msg(id(cfg_msg_wake_tick).state, "GOOD MORNING, {name}!") + " · ISS \u2192 " + reg;
              } else if (bday_sleeps >= 1 && bday_sleeps <= 14) {
                char bbuf[64];
                snprintf(bbuf, sizeof(bbuf), "%d %s TO BIRTHDAY! · ISS \u2192 %s", bday_sleeps, (bday_sleeps == 1) ? "SLEEP" : "SLEEPS", reg);
                tick = bbuf;
              } else if (id(cfg_holidays_en).state && !id(minimal_teen_mode) && now.is_valid() && now.month == 10 && now.day_of_month >= 25 && now.day_of_month < 31) {
                char hbuf[64];
                snprintf(hbuf, sizeof(hbuf), "%d DAYS TO HALLOWEEN! · ISS \u2192 %s", 31 - now.day_of_month, reg);
                tick = hbuf;
              } else {
                tick = std::string(id(iss_is_eclipsed) ? "ISS (NIGHT SIDE) \u2192 OVER " : "SPACE STATION (ISS) \u2192 OVER ") + reg;
              }
            }
          } else if (m == 2) {
            int age = std::max(1, now.is_valid() ? (now.year - id(active_birth_year)) : 7);
            const char *ord = ((age % 100 >= 11 && age % 100 <= 13)) ? "TH"
                            : ((age % 10 == 1) ? "ST" : ((age % 10 == 2) ? "ND" : ((age % 10 == 3) ? "RD" : "TH")));
            char bb[64];
            snprintf(bb, sizeof(bb), "IT'S YOUR %d%s BIRTHDAY, %s!", age, ord, cname.c_str());
            tick = bb;
          } else if (m == 3) {
            int day_dec = (now.is_valid() && now.month == 12) ? std::clamp((int)now.day_of_month, 1, 24) : 16;
            int sleeps = 25 - day_dec;
            int filled = (day_dec * 8) / 24;
            std::string bar = "\uEE03";
            for (int k = 1; k <= 8; k++) bar += (k <= filled) ? "\uEE04" : "\uEE01";
            bar += (filled >= 8) ? "\uEE05" : "\uEE02";
            char xb[64];
            snprintf(xb, sizeof(xb), " %d %s TO XMAS!", sleeps, (sleeps == 1) ? "SLEEP" : "SLEEPS");
            tick = std::string("ADVENT ") + bar + xb;
          } else if (m == 9) {
            tick = std::string("MERRY CHRISTMAS MORNING, ") + cname + "!";
          } else if (m == 4) {
            if (id(santa_wp_idx) < 0) {
              tick = "CHRISTMAS EVE  \u2192  SLEIGH PREP AT NORTH POLE";
            } else if (id(santa_dist_km) < 120) {
              tick = std::string("SANTA IS OVER ") + loc + " RIGHT NOW!";
            } else {
              char st_b[64];
              int d_val = use_mi ? world_clock::km_to_mi(id(santa_dist_km)) : id(santa_dist_km);
              snprintf(st_b, sizeof(st_b), "SANTA \u2192 %s · %d %s AWAY!", id(santa_city).c_str(), d_val, use_mi ? "MI" : "KM");
              tick = st_b;
            }
          } else if (m == 5) {
            tick = "SPOOKY HALLOWEEN MODE  ·  HAPPY HALLOWEEN!";
          } else if (m == 6) {
            tick = std::string("HAPPY EASTER, ") + cname + "  ·  SPOT THE 5 EGGS!";
          } else if (m == 7) {
            tick = (now.is_valid() && now.month == 11) ? "REMEMBER, REMEMBER  ·  BONFIRE NIGHT!"
                                                       : (std::string("HAPPY NEW YEAR, ") + cname + "!");
          } else if (m == 8) {
            tick = "STAR WARS DAY  \u2192  TWIN SUNS & TIE PATROL";
          }
          world_clock::utf8_truncate_codepoints(tick, 44);
          lv_label_set_text(id(ticker_label), tick.c_str());

      - script.execute: update_launchpad_ui
      - script.execute: update_dock_1hz
