number:
  - platform: template
    id: cfg_lat
    name: "Home Latitude"
    mode: box
    min_value: -53.0
    max_value: 75.5
    step: 0.0001
    unit_of_measurement: "°"
    optimistic: true
    restore_value: true
    initial_value: ${default_lat}
    web_server: { sorting_group_id: grp_profile, sorting_weight: 40 }
    on_value:
      then:
        - lambda: |-
            auto &t = world_clock::standalone_telemetry();
            while (__atomic_test_and_set(&t.lock, __ATOMIC_ACQUIRE)) vTaskDelay(1);
            t.work_lat = x;
            __atomic_clear(&t.lock, __ATOMIC_RELEASE);
            id(active_lat) = x;
            __atomic_store_n(&t.force_sync, true, __ATOMIC_RELEASE);
            id(force_redraw) = true;
        - script.execute: save_prefs_debounced

  - platform: template
    id: cfg_lon
    name: "Home Longitude"
    mode: box
    min_value: -167.0
    max_value: 178.0
    step: 0.0001
    unit_of_measurement: "°"
    optimistic: true
    restore_value: true
    initial_value: ${default_lon}
    web_server: { sorting_group_id: grp_profile, sorting_weight: 50 }
