# Standalone Backend: Core 0 Open-Meteo + ISS + .ics NetWorker, Google NTP, Captive Portal & Full iPhone Web UI v3
world_clock:
  standalone: true

globals:
  # Persisted 64-bit random token for per-device Web UI password (generated via esp_random() on first boot; never exposed in sensors!)
  - { id: web_pass_token, type: uint64_t, restore_value: yes, initial_value: '0' }
  - { id: active_web_pass, type: std::string, restore_value: no, initial_value: '""' }

esphome:
  includes:
    - <esp_crt_bundle.h>
    - <esp_random.h>
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // Universal multi-device release mode: generate & persist a cryptographically random 8-char
            // setup password in NVS (never derived from broadcast MAC/mDNS!) and display ONLY on physical splash.
            std::string mac_full = esphome::get_mac_address();
            std::string mac6 = (mac_full.size() >= 6) ? mac_full.substr(mac_full.size() - 6) : mac_full;
            if (esphome::App.is_name_add_mac_suffix_enabled()) {
              if (id(web_pass_token) == 0ULL) {
                uint64_t tok = 0ULL;
                while (tok == 0ULL) {
                  tok = ((uint64_t)esp_random() << 32) | (uint64_t)esp_random();
                }
                id(web_pass_token) = tok;
              }
              id(active_web_pass) = world_clock::format_random_setup_password(id(web_pass_token));
              #if defined(USE_WEBSERVER_AUTH)
                if (esphome::web_server_base::global_web_server_base != nullptr) {
                  esphome::web_server_base::global_web_server_base->set_auth_password(id(active_web_pass).c_str());
                }
              #endif
            }
            std::string url_s = "http://" + esphome::App.get_name() + ".local/";
            id(diag_web_url).publish_state(url_s);
            id(diag_hw_id).publish_state(mac6);

            // Apply restored runtime timezone & calendar URLs before Core 0 starts polling
            #ifdef USE_TIME_TIMEZONE
              world_clock::apply_named_timezone(id(cfg_timezone).current_option());
            #endif
            auto &t = world_clock::standalone_telemetry();
            t.ensure_mutex();
            if (t.lock(pdMS_TO_TICKS(50))) {
              snprintf(t.family_cal_url, sizeof(t.family_cal_url), "%s", id(cfg_family_cal_url).state.c_str());
              snprintf(t.school_cal_url, sizeof(t.school_cal_url), "%s", id(cfg_school_cal_url).state.c_str());
              t.unlock();
            }

            float init_lat = !std::isnan(id(cfg_lat).state) ? id(cfg_lat).state : (float)${default_lat};
            float init_lon = !std::isnan(id(cfg_lon).state) ? id(cfg_lon).state : (float)${default_lon};
            id(active_lat) = init_lat;
            id(active_lon) = init_lon;
            world_clock::NetWorker::start(init_lat, init_lon);
        - component.update: device_prefs

esp32:
  framework:
    sdkconfig_options:
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: "y"
      CONFIG_LWIP_MAX_SOCKETS: "18"

http_request:
  timeout: 5s

wifi:
  id: wifi_conn
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  reboot_timeout: 0s
  ap:
    ssid: "${display_name} Setup"
    password: !secret ap_password
    ap_timeout: 30s

captive_portal:

mdns:
  disabled: false

web_server:
  port: 80
  version: 3
  local: true
  auth:
    type: digest
    username: !secret web_auth_user
    password: !secret web_auth_pass
  sorting_groups:
    - { id: grp_controls, name: "1. Quick Controls & Overrides", sorting_weight: 10 }
    - { id: grp_profile,  name: "2. Child Profile, Location & Units", sorting_weight: 20 }
    - { id: grp_schedule, name: "3. Sleep Schedule & Brightness", sorting_weight: 30 }
    - { id: grp_messages, name: "4. Custom Screen Wording ({name}, {quiet}, {bedtime})", sorting_weight: 40 }
    - { id: grp_calendar, name: "5. Family & School Calendar (.ics) & Countdown", sorting_weight: 45 }
    - { id: grp_holidays, name: "6. Occasions & Visual Features", sorting_weight: 50 }
    - { id: grp_diag,     name: "7. Device Diagnostics", sorting_weight: 90 }

ota:
  - platform: web_server
    on_begin:
      then:
        - script.execute: ota_splash_begin
    on_progress:
      then:
        - lambda: 'world_clock::ota_ui_state().pct.store((int)x, std::memory_order_relaxed);'
    on_end:
      then:
        - script.execute: ota_splash_end
    on_error:
      then:
        - script.execute: ota_splash_error

time:
  - platform: sntp
    id: clock_time
    timezone: "${timezone}"
    servers:
      - time1.google.com
      - time2.google.com
      - time3.google.com
    on_time_sync:
      then:
        - lambda: 'id(force_redraw) = true;'

light:
  - id: !extend display_backlight
    web_server: { sorting_group_id: grp_controls, sorting_weight: 20 }

select:
  - id: !extend occasion_select
    web_server: { sorting_group_id: grp_controls, sorting_weight: 10 }
  - platform: template
    id: cfg_age_profile
    name: "Age & Visual Profile"
    optimistic: true
    restore_value: true
    initial_option: "Junior Space Kid (7-11)"
    options:
      - "Little Explorer (3-6)"
      - "Junior Space Kid (7-11)"
      - "Teen & Study Desk (12+)"
    web_server: { sorting_group_id: grp_controls, sorting_weight: 15 }
    on_value:
      then:
        - lambda: |-
            if (x == "Teen & Study Desk (12+)") {
              id(minimal_teen_mode) = true;
              id(cfg_use_24h).publish_state(true);
              id(cfg_holidays_en).publish_state(false);
              id(cfg_winddown_en).publish_state(false);
              id(cfg_sleep_en).publish_state(false);
              id(cfg_quiet_en).publish_state(false);
            } else if (x == "Little Explorer (3-6)") {
              id(minimal_teen_mode) = false;
              id(cfg_use_24h).publish_state(false);
              id(cfg_holidays_en).publish_state(true);
              id(cfg_winddown_en).publish_state(true);
              id(cfg_sleep_en).publish_state(true);
              id(cfg_quiet_en).publish_state(true);
              id(cfg_sleep_stars_en).publish_state(true);
            } else {
              id(minimal_teen_mode) = false;
              id(cfg_use_24h).publish_state(false);
              id(cfg_holidays_en).publish_state(true);
              id(cfg_winddown_en).publish_state(true);
              id(cfg_sleep_en).publish_state(true);
              id(cfg_quiet_en).publish_state(true);
            }
            id(force_redraw) = true;
        - script.execute: save_prefs_debounced
  - platform: template
    id: cfg_cal_priority
    name: "Calendar Priority Mode"
    optimistic: true
    restore_value: true
    initial_option: "Smart Auto"
    options:
      - "Smart Auto"
      - "Today & Routine First"
      - "Countdowns First"
    web_server: { sorting_group_id: grp_calendar, sorting_weight: 25 }
    on_value:
      then:
        - lambda: |-
            id(cal_priority_mode) = (x == "Today & Routine First") ? 1 : ((x == "Countdowns First") ? 2 : 0);
            id(force_redraw) = true;
        - script.execute: save_prefs_debounced
  - platform: template
    id: cfg_cal_style
    name: "Calendar Display Style"
    optimistic: true
    restore_value: true
    initial_option: "Subtle Ticker Only"
    options:
      - "Subtle Ticker Only"
      - "Prominent Dock Card"
      - "Morning Launchpad Takeover"
    web_server: { sorting_group_id: grp_calendar, sorting_weight: 26 }
    on_value:
      then:
        - lambda: |-
            id(cal_display_style) = (x == "Prominent Dock Card") ? 1 : ((x == "Morning Launchpad Takeover") ? 2 : 0);
            id(force_redraw) = true;
        - script.execute: save_prefs_debounced
  - platform: template
    id: cfg_timezone
    name: "Timezone"
    optimistic: true
    restore_value: true
    initial_option: "UK (London GMT/BST)"
    options:
      - "UK (London GMT/BST)"
      - "Europe (Paris/Berlin CET)"
      - "Europe (Helsinki/Athens EET)"
      - "US Eastern (ET)"
      - "US Central (CT)"
      - "US Mountain (MT)"
      - "US Pacific (PT)"
      - "Canada Atlantic (AT)"
      - "Australia Sydney (AEST/AEDT)"
      - "Australia Perth (AWST)"
      - "New Zealand (NZST/NZDT)"
      - "UTC"
    web_server: { sorting_group_id: grp_profile, sorting_weight: 55 }
    on_value:
      then:
        - lambda: |-
            #ifdef USE_TIME_TIMEZONE
              world_clock::apply_named_timezone(x);
            #endif
            world_clock::standalone_telemetry().cal_force_sync.store(true, std::memory_order_release);
            id(force_redraw) = true;
        - script.execute: save_prefs_debounced

button:
  - platform: template
    name: "Sync Weather, ISS & Calendars Now"
    id: sync_now_btn
    web_server: { sorting_group_id: grp_controls, sorting_weight: 30 }
    on_press:
      then:
        - lambda: 'world_clock::standalone_telemetry().force_sync.store(true, std::memory_order_release);'
  - platform: template
    name: "Start Nap Mode Now"
    id: start_nap_btn
    web_server: { sorting_group_id: grp_controls, sorting_weight: 50 }
    on_press:
      then:
        - lambda: |-
            uint32_t dur_ms = (uint32_t)std::clamp(id(cfg_nap_minutes).state, 15.0f, 180.0f) * 60000UL;
            id(nap_total_ms) = dur_ms;
            id(nap_end_ms) = millis() + dur_ms;
            if (id(nap_end_ms) == 0) id(nap_end_ms) = 1;
            id(force_redraw) = true;
  - platform: template
    name: "Trigger Wind-Down Now"
    id: start_winddown_btn
    web_server: { sorting_group_id: grp_controls, sorting_weight: 55 }
    on_press:
      then:
        - lambda: |-
            auto now = id(clock_time).now();
            id(nap_end_ms) = 0;
            id(winddown_override_yday) = now.is_valid() ? now.day_of_year : 1;
            id(force_redraw) = true;
  - platform: template
    name: "Cancel Nap or Wind-Down Override"
    id: cancel_override_btn
    web_server: { sorting_group_id: grp_controls, sorting_weight: 60 }
    on_press:
      then:
        - lambda: |-
            id(nap_end_ms) = 0;
            id(winddown_override_yday) = -1;
            id(force_redraw) = true;
  - platform: template
    name: "Start 25m Focus Study"
    id: start_focus_btn
    web_server: { sorting_group_id: grp_controls, sorting_weight: 62 }
    on_press:
      then:
        - lambda: |-
            id(focus_is_break) = false;
            id(focus_total_ms) = 25UL * 60000UL;
            id(focus_end_ms) = millis() + id(focus_total_ms);
            if (id(focus_end_ms) == 0) id(focus_end_ms) = 1;
            id(force_redraw) = true;
  - platform: template
    name: "Start 5m Focus Break"
    id: start_break_btn
    web_server: { sorting_group_id: grp_controls, sorting_weight: 64 }
    on_press:
      then:
        - lambda: |-
            id(focus_is_break) = true;
            id(focus_total_ms) = 5UL * 60000UL;
            id(focus_end_ms) = millis() + id(focus_total_ms);
            if (id(focus_end_ms) == 0) id(focus_end_ms) = 1;
            id(force_redraw) = true;
  - platform: template
    name: "Stop Focus Timer"
    id: stop_focus_btn
    web_server: { sorting_group_id: grp_controls, sorting_weight: 66 }
    on_press:
      then:
        - lambda: |-
            id(focus_end_ms) = 0;
            id(focus_rem_01) = -1.0f;
            id(force_redraw) = true;
  - platform: restart
    name: "Restart Clock"
    web_server: { sorting_group_id: grp_diag, sorting_weight: 90 }

switch:
  # Quick Controls: Shop Demo Mode & Tooth Fairy Night
  - platform: template
    id: cfg_demo_mode
    name: "Shop & Fayre Demo Mode (Auto-Cycle)"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server: { sorting_group_id: grp_controls, sorting_weight: 70 }
    on_turn_on:
      then:
        - lambda: 'id(demo_mode_active) = true; id(demo_mode_idx) = 0;'
    on_turn_off:
      then:
        - lambda: 'id(demo_mode_active) = false;'
        - select.set: { id: occasion_select, option: "Auto" }

  - platform: template
    id: cfg_tooth_fairy
    name: "Tooth Fairy Tonight!"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server: { sorting_group_id: grp_controls, sorting_weight: 40 }
    on_turn_on:  { then: [ lambda: 'id(tooth_fairy_active) = true; id(force_redraw) = true;', script.execute: save_prefs_debounced ] }
    on_turn_off: { then: [ lambda: 'id(tooth_fairy_active) = false; id(force_redraw) = true;', script.execute: save_prefs_debounced ] }

