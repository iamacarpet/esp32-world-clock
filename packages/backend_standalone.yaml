text_sensor:
  - platform: template
    id: diag_web_url
    name: "Web Settings URL"
    web_server: { sorting_group_id: grp_diag, sorting_weight: 5 }
  - platform: template
    id: diag_hw_id
    name: "Hardware ID (MAC Suffix)"
    web_server: { sorting_group_id: grp_diag, sorting_weight: 8 }
  - platform: version
    name: "Firmware Version"
    web_server: { sorting_group_id: grp_diag, sorting_weight: 40 }
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_str
      web_server: { sorting_group_id: grp_diag, sorting_weight: 10 }
    ssid:
      name: "Connected Wi-Fi"
      web_server: { sorting_group_id: grp_diag, sorting_weight: 20 }

sensor:
  - platform: uptime
    name: "Uptime"
    web_server: { sorting_group_id: grp_diag, sorting_weight: 30 }
  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi Signal"
    update_interval: 30s
    web_server: { sorting_group_id: grp_diag, sorting_weight: 25 }

script:
  - id: save_prefs_debounced
    mode: restart
    then:
      - delay: 5s
      - component.update: device_prefs

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE)) return;

          auto now = id(clock_time).now();
          auto utc = id(clock_time).utcnow();
          uint32_t now_ms = millis();
          if (!id(boot_grace_done) && now_ms >= 45000UL) id(boot_grace_done) = true;

          // 1. Contention-Safe Non-Blocking Core 0 Weather & ISS Handoff
          auto &t = world_clock::standalone_telemetry();
          static bool s_wx_ever = false;
          static uint32_t s_wx_stamp = 0;
          static uint32_t s_seen_iss_ms = 0;
          bool wx_changed = false;
          bool got_iss = false;
          float in_lat = 0.0f, in_lon = 0.0f;
          bool in_ecl = false;
          uint32_t iss_stamp = 0;

          if (!__atomic_test_and_set(&t.lock, __ATOMIC_ACQUIRE)) {
            s_wx_ever = t.wx_valid;
            s_wx_stamp = t.wx_ms;
            if (t.wx_dirty) {
              id(cur_wx_temp) = t.wx_temp;
              id(cur_wx_feels) = t.wx_feels;
              id(cur_wx_high) = t.wx_high;
              id(cur_wx_low) = t.wx_low;
              id(cur_wx_cond) = t.cond_buf;
              id(cur_wx_3day) = t.forecast_3day_buf;
              t.wx_dirty = false;
              wx_changed = true;
            }
            if (t.iss_valid && t.iss_ms != s_seen_iss_ms) {
              in_lat = t.iss_lat;
              in_lon = t.iss_lon;
              in_ecl = t.iss_eclipsed;
              iss_stamp = t.iss_ms;
              got_iss = true;
            }
            __atomic_clear(&t.lock, __ATOMIC_RELEASE);
          }

          id(cur_wx_age_ok) = s_wx_ever && ((uint32_t)(now_ms - s_wx_stamp) <= 7200000UL);
          if (wx_changed) id(force_redraw) = true;

          if (got_iss) {
            if (id(iss_has_fix)) {
              float dt_s = (float)(iss_stamp - id(iss_fix_ms)) / 1000.0f;
              float dlon = in_lon - id(iss_cur_lon);
              if (dlon > 180.0f) dlon -= 360.0f;
              if (dlon < -180.0f) dlon += 360.0f;
              float dlat = in_lat - id(iss_cur_lat);
              if (dt_s >= 2.0f && dt_s <= 180.0f) {
                id(iss_vel_lat) = std::clamp(dlat / dt_s, -0.12f, 0.12f);
                id(iss_vel_lon) = std::clamp(dlon / dt_s, -0.02f, 0.14f);
              }
            } else {
              id(iss_vel_lat) = 0.0f;
              id(iss_vel_lon) = 0.060f;
            }
            s_seen_iss_ms = iss_stamp;
            id(iss_cur_lat) = in_lat;
            id(iss_cur_lon) = in_lon;
            id(iss_is_eclipsed) = in_ecl;
            id(iss_fix_ms) = iss_stamp;
            id(iss_has_fix) = true;
          }
          if (id(iss_has_fix) && (uint32_t)(now_ms - id(iss_fix_ms)) > 180000UL) {
            id(iss_has_fix) = false;
            world_clock::sprite_engine().reset_iss_smoothing();
          }

          // 2. Sync Live Web Settings into Core State
          std::string cname = id(cfg_child_name).state.empty() ? "${default_child_name}" : id(cfg_child_name).state;
          std::string cname_up = world_clock::to_upper_ascii(cname);
          std::string loc_up = world_clock::to_upper_ascii(id(cfg_loc_name).state.empty() ? "${default_location}" : id(cfg_loc_name).state);
          world_clock::utf8_truncate_codepoints(loc_up, 12);
          id(active_child_name) = cname;
          id(active_loc_name) = loc_up;
          id(active_birth_year) = (id(cfg_birthdate).year > 1900) ? (int)id(cfg_birthdate).year : ${default_birth_year};
          id(use_24h_clock) = id(cfg_use_24h).state;
          id(use_fahrenheit) = id(cfg_use_fahrenheit).state;
          id(use_miles) = id(cfg_use_miles).state;
          id(show_night_lights) = id(cfg_night_lights).state;
          id(keep_santa_winddown) = id(cfg_santa_winddown).state;

          // 3. Rollover-Safe Boot Splash State Machine (Connecting -> AP Ready -> SNTP -> Info Hold -> Live)
          bool wifi_ok = id(wifi_conn).is_connected();
          bool time_ok = utc.is_valid();
          static bool s_wifi_was_down = false;
          static uint32_t s_wifi_down_ms = 0;
          static uint32_t s_ready_ms = 0;
          bool ap_ready = false;
          if (!wifi_ok) {
            if (!s_wifi_was_down) { s_wifi_down_ms = now_ms; s_wifi_was_down = true; }
            ap_ready = ((uint32_t)(now_ms - s_wifi_down_ms) >= 15000UL);
          } else {
            s_wifi_was_down = false;
          }

          // In universal MAC-suffixed release mode, briefly hold the connected info splash (4s)
          // so a parent can always power-cycle the clock to read its unique URL, IP & password!
          bool mac_mode = esphome::App.is_name_add_mac_suffix_enabled();
          bool info_hold = false;
          if (!id(boot_complete) && wifi_ok && time_ok && mac_mode) {
            if (s_ready_ms == 0) s_ready_ms = now_ms;
            info_hold = ((uint32_t)(now_ms - s_ready_ms) < 4000UL);
          }

          uint8_t next_st = 4;
          if (!id(boot_complete)) {
            if (!wifi_ok) next_st = ap_ready ? 3 : 1;
            else if (!time_ok || info_hold) next_st = 2;
            else next_st = 4;
          } else if (${fullscreen_watchdog} && !wifi_ok) {
            next_st = ap_ready ? 3 : 1;
          }

          if (next_st != id(overlay_state) || (next_st == 2 && !id(boot_complete))) {
            id(overlay_state) = next_st;
            if (next_st != 4) {
              #if LVGL_VERSION_MAJOR >= 9
                lv_obj_remove_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
              #else
                lv_obj_clear_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
              #endif
              std::string kick = cname_up + "'S WORLD & SPACE CLOCK";
              lv_label_set_text(id(splash_kicker), kick.c_str());
              std::string dev_host = esphome::App.get_name();
              std::string mac_full = esphome::get_mac_address();
              std::string mac6 = (mac_full.size() >= 6) ? mac_full.substr(mac_full.size() - 6) : mac_full;
              if (next_st == 1) {
                lv_label_set_text(id(splash_title), "CONNECTING TO WI-FI...");
                lv_label_set_text(id(splash_sub), "Step 1/2  \u2192  Joining Home Wi-Fi");
                lv_label_set_text(id(splash_hint), mac_mode ? ("Device ID: " + dev_host).c_str() : "");
                lv_bar_set_value(id(splash_bar), 38, LV_ANIM_OFF);
              } else if (next_st == 3) {
                lv_label_set_text(id(splash_title), "WIFI SETUP HOTSPOT READY");
                std::string ap_line = mac_mode
                    ? ("Join Wi-Fi: " + dev_host + "  ·  PW: ClockSetup123")
                    : "Join '${display_name} Setup' (See Setup Card)";
                lv_label_set_text(id(splash_sub), ap_line.c_str());
                lv_label_set_text(id(splash_hint), "Connect on phone to pick your home Wi-Fi");
                lv_bar_set_value(id(splash_bar), 50, LV_ANIM_OFF);
              } else {
                lv_label_set_text(id(splash_title), time_ok ? "CLOCK READY!" : "SYNCING GOOGLE ATOMIC TIME...");
                std::string ip_s = id(wifi_ip_str).has_state() ? id(wifi_ip_str).state : "";
                std::string sub_s = "http://" + dev_host + ".local/";
                if (!ip_s.empty()) sub_s += "  ·  " + ip_s;
                lv_label_set_text(id(splash_sub), sub_s.c_str());
                std::string hint_s = mac_mode
                    ? ("Web Settings Login:  parent  /  clock-" + mac6)
                    : "Open in Safari / Chrome to customize settings";
                lv_label_set_text(id(splash_hint), hint_s.c_str());
                lv_bar_set_value(id(splash_bar), time_ok ? 100 : 82, LV_ANIM_OFF);
              }
            }
          }

          if (!id(boot_complete)) {
            if (wifi_ok && time_ok && !info_hold) {
              id(boot_complete) = true;
              id(force_redraw) = true;
              lv_obj_add_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
            } else {
              return;
            }
          } else if (next_st == 4) {
            lv_obj_add_flag(id(splash_overlay), LV_OBJ_FLAG_HIDDEN);
          }

          // 4. Daily Min/Max RAM Fallback + Dynamic Token Resolution
          float cur_t = id(cur_wx_temp);
          if (now.is_valid() && !std::isnan(cur_t)) {
            if (id(tracked_yday) != now.day_of_year) {
              id(tracked_yday) = now.day_of_year;
              id(tracked_high) = cur_t;
              id(tracked_low) = cur_t;
            } else {
              if (cur_t > id(tracked_high)) id(tracked_high) = cur_t;
              if (cur_t < id(tracked_low)) id(tracked_low) = cur_t;
            }
          }

          const bool use24 = id(use_24h_clock);
          world_clock::TokenContext tctx{
              cname_up,
              world_clock::format_short_time((int)id(cfg_winddown_time).hour, (int)id(cfg_winddown_time).minute, use24),
              world_clock::format_short_time((int)id(cfg_bedtime).hour, (int)id(cfg_bedtime).minute, use24),
              world_clock::format_short_time((int)id(cfg_quiet_time).hour, (int)id(cfg_quiet_time).minute, use24),
              world_clock::format_short_time((int)id(cfg_wakeup_time).hour, (int)id(cfg_wakeup_time).minute, use24),
          };
          auto resolve_msg = [&](const std::string &raw, const char *fallback) -> std::string {
            return world_clock::expand_tokens(raw.empty() ? fallback : raw, tctx);
          };
          id(msg_sleep_title_resolved)    = resolve_msg(id(cfg_msg_sleep_title).state, "BEFORE {quiet} · SLEEP TIME");
          id(msg_sleep_sub_resolved)      = resolve_msg(id(cfg_msg_sleep_sub).state, "Can't sleep? Wake Mum & Dad");
          id(msg_quiet_title_resolved)    = resolve_msg(id(cfg_msg_quiet_title).state, "PAST {quiet} · OK TO GET UP");
          id(msg_quiet_sub_resolved)      = resolve_msg(id(cfg_msg_quiet_sub).state, "Quiet play in your room OK!");
          id(msg_winddown_title_resolved) = resolve_msg(id(cfg_msg_winddown_title).state, "TIME TO GET READY FOR BED");
          id(msg_winddown_sub_resolved)   = resolve_msg(id(cfg_msg_winddown_sub).state, "PJs, teeth & story · Bed {bedtime}");
          id(msg_xmas_title_resolved)     = resolve_msg(id(cfg_msg_xmas_title).state, "MERRY CHRISTMAS!");
          id(msg_xmas_sub_resolved)       = resolve_msg(id(cfg_msg_xmas_sub).state, "Time for presents, {name}!");

          // 5. 4-Phase Schedule & Occasion Evaluation
          world_clock::ScheduleConfig scfg;
          scfg.winddown_enabled = id(cfg_winddown_en).state;
          scfg.sleep_enabled = id(cfg_sleep_en).state;
          scfg.quiet_enabled = id(cfg_quiet_en).state;
          scfg.winddown_m = (int)id(cfg_winddown_time).hour * 60 + (int)id(cfg_winddown_time).minute;
          scfg.bedtime_m  = (int)id(cfg_bedtime).hour       * 60 + (int)id(cfg_bedtime).minute;
          scfg.quiet_m    = (int)id(cfg_quiet_time).hour    * 60 + (int)id(cfg_quiet_time).minute;
          scfg.wakeup_m   = (int)id(cfg_wakeup_time).hour   * 60 + (int)id(cfg_wakeup_time).minute;
          scfg.special_delay_m = (int)roundf(std::isnan(id(cfg_special_delay).state) ? 0.0f : id(cfg_special_delay).state);

          int b_mon = (id(cfg_birthdate).month >= 1) ? (int)id(cfg_birthdate).month : 1;
          int b_day = (id(cfg_birthdate).day >= 1)   ? (int)id(cfg_birthdate).day   : 1;

          std::string sel = id(occasion_select).current_option();
          uint8_t slp = 0;
          uint8_t mode = 1;

          if (sel == "Sleep Preview (Red)") {
            slp = 1; mode = 0;
          } else if (sel == "Quiet Play Preview (Amber)") {
            slp = 2; mode = 0;
          } else if (sel == "Wind-Down Preview (Amber)") {
            slp = 3; mode = (now.is_valid() && now.month == 12 && now.day_of_month == 24) ? 4 : 0;
          } else if (sel != "Auto") {
            slp = 0;
            if (sel == "Classic Map") mode = 0;
            else if (sel == "ISS Space Tracker") mode = 1;
            else if (sel == "Birthday Mode") mode = 2;
            else if (sel == "Christmas Advent") mode = 3;
            else if (sel == "Christmas Day") mode = 9;
            else if (sel == "Santa Tracker") mode = 4;
            else if (sel == "Halloween") mode = 5;
            else if (sel == "Easter Egg Hunt") mode = 6;
            else if (sel == "Fireworks") mode = 7;
            else if (sel == "Star Wars Day") mode = 8;
          } else if (now.is_valid()) {
            int m = now.month, d = now.day_of_month, yr = now.year;
            bool is_special_night = (m == 12 && (d == 24 || d == 31)) || (m == 11 && d == 5);
            slp = world_clock::evaluate_schedule(now.hour * 60 + now.minute, scfg, is_special_night);

            bool hol_en = id(cfg_holidays_en).state;
            if (m == b_mon && d == b_day) mode = 2;
            else if (hol_en && m == 12 && d == 25) mode = 9;
            else if (hol_en && m == 12 && d == 24) mode = 4;
            else if (hol_en && m == 12 && d < 24) mode = 3;
            else if (hol_en && m == 10 && d == 31) mode = 5;
            else if (hol_en && ((m == 11 && d == 5) || (m == 12 && d == 31) || (m == 1 && d == 1))) mode = 7;
            else if (hol_en && m == 5 && d == 4) mode = 8;
            else if (hol_en && world_clock::is_easter_window(yr, m, d)) mode = 6;
            else mode = id(cfg_iss_en).state ? 1 : 0;
          }

          uint8_t pal = (slp == 1) ? 1 : ((slp == 2 || slp == 3) ? 2 : 0);
          bool mode_changed = (slp != id(sleep_phase)) || (mode != id(active_occasion));
          bool changed = mode_changed || id(force_redraw);
          if (mode_changed) {
            id(badge_mode_applied) = 255;
            if (mode != 4) id(santa_wp_idx) = -1;
          }
          id(sleep_phase) = slp;
          id(ui_palette) = pal;
          id(active_occasion) = mode;
          __atomic_store_n(&t.sleep_phase, slp, __ATOMIC_RELEASE);
          __atomic_store_n(&t.active_occasion, mode, __ATOMIC_RELEASE);
          if (changed) {
            id(force_redraw) = false;
            id(applied_palette) = 255;
          }

      - if:
          condition:
            lambda: 'return id(boot_complete) && !__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE) && id(applied_palette) != id(ui_palette);'
          then:
            - script.execute: apply_shell_palette

      # 4-Phase Automatic Circadian Backlight Dimming
      - if:
          condition:
            lambda: 'return id(boot_complete) && !__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE) && id(applied_backlight_phase) != id(sleep_phase);'
          then:
            - lambda: 'id(applied_backlight_phase) = id(sleep_phase);'
            - if:
                condition:
                  lambda: 'return id(sleep_phase) == 1;'
                then:
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return std::clamp(id(cfg_sleep_bright).state / 100.0f, 0.05f, 1.0f);'
                      transition_length: 1500ms
            - if:
                condition:
                  lambda: 'return id(sleep_phase) == 2;'
                then:
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return std::clamp(id(cfg_quiet_bright).state / 100.0f, 0.05f, 1.0f);'
                      transition_length: 1500ms
            - if:
                condition:
                  lambda: 'return id(sleep_phase) == 3;'
                then:
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return std::clamp(id(cfg_winddown_bright).state / 100.0f, 0.10f, 1.0f);'
                      transition_length: 1500ms
            - if:
                condition:
                  lambda: 'return id(sleep_phase) == 0;'
                then:
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return std::clamp(id(cfg_day_bright).state / 100.0f, 0.15f, 1.0f);'
                      transition_length: 1500ms

      # Status Icons, Clock, Date, Ticker & Dock 1Hz Update
      - lambda: |-
          if (__atomic_load_n(&id(ota_active), __ATOMIC_ACQUIRE)) return;

          // Wi-Fi icon
          bool w_ok = id(wifi_conn).is_connected();
          if (w_ok) {
            float rssi = id(wifi_rssi).state;
            const char *wico = (std::isnan(rssi) || rssi >= -55.0f) ? "\U000F0928"
                             : ((rssi >= -67.0f) ? "\U000F0925" : ((rssi >= -77.0f) ? "\U000F0922" : "\U000F091F"));
            lv_label_set_text(id(wifi_icon_label), wico);
            lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex((id(ui_palette) == 0) ? 0x787882 : 0x7A1812), 0);
          } else {
            lv_label_set_text(id(wifi_icon_label), "\U000F05AA");
            lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0xE84A18), 0);
          }

          // Cloud Sync icon
          bool iss_ok = (id(active_occasion) != 1 || id(sleep_phase) != 0 || id(iss_has_fix));
          bool sync_busy = __atomic_load_n(&world_clock::standalone_telemetry().sync_busy, __ATOMIC_ACQUIRE);
          if (!w_ok || (id(boot_grace_done) && !id(cur_wx_age_ok))) {
            lv_label_set_text(id(sync_icon_label), "\U000F0164");
            lv_obj_set_style_text_color(id(sync_icon_label), lv_color_hex(0xE84A18), 0);
          } else if (sync_busy || !id(cur_wx_age_ok) || !iss_ok) {
            lv_label_set_text(id(sync_icon_label), "\U000F063F");
            lv_obj_set_style_text_color(id(sync_icon_label), lv_color_hex((id(ui_palette) == 0) ? 0xFFB830 : 0x9E141C), 0);
          } else {
            lv_label_set_text(id(sync_icon_label), "\U000F0160");
            lv_obj_set_style_text_color(id(sync_icon_label), lv_color_hex((id(ui_palette) == 0) ? 0x787882 : 0x7A1812), 0);
          }

          if (!id(boot_complete)) return;

          auto now = id(clock_time).now();
          const bool use24 = id(use_24h_clock);
          const bool use_mi = id(use_miles);
          std::string cname = world_clock::to_upper_ascii(id(active_child_name));
          std::string loc = id(active_loc_name);

          static std::string s_last_date, s_last_loc;
          bool relayout_hdr = false;
          if (now.is_valid()) {
            char cbuf[24];
            if (use24) {
              snprintf(cbuf, sizeof(cbuf), "%02d\u2236%02d\u2236%02d", now.hour, now.minute, now.second);
              lv_obj_add_flag(id(ampm_label), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(id(clock_label), -42);
            } else {
              int hr12 = now.hour % 12;
              if (hr12 == 0) hr12 = 12;
              snprintf(cbuf, sizeof(cbuf), "%d\u2236%02d\u2236%02d", hr12, now.minute, now.second);
              #if LVGL_VERSION_MAJOR >= 9
                lv_obj_remove_flag(id(ampm_label), LV_OBJ_FLAG_HIDDEN);
              #else
                lv_obj_clear_flag(id(ampm_label), LV_OBJ_FLAG_HIDDEN);
              #endif
              lv_obj_set_x(id(clock_label), -84);
              lv_label_set_text(id(ampm_label), (now.hour >= 12) ? "PM" : "AM");
            }
            lv_label_set_text(id(clock_label), cbuf);

            char dbuf[48];
            now.strftime(dbuf, sizeof(dbuf), "%A, %d %b %Y");
            if (s_last_date != dbuf) {
              s_last_date = dbuf;
              lv_label_set_text(id(date_label), dbuf);
              relayout_hdr = true;
            }
          }

          if (s_last_loc != loc) {
            s_last_loc = loc;
            lv_label_set_text(id(loc_label), loc.c_str());
            relayout_hdr = true;
          }
          if (relayout_hdr) {
            lv_obj_set_size(id(loc_pill), LV_SIZE_CONTENT, LV_SIZE_CONTENT);
            lv_obj_update_layout(lv_obj_get_parent(id(date_label)));
            lv_obj_align_to(id(loc_pill), id(date_label), LV_ALIGN_OUT_RIGHT_MID, 10, 0);
          }

          world_clock::TokenContext tctx{
              cname,
              world_clock::format_short_time((int)id(cfg_winddown_time).hour, (int)id(cfg_winddown_time).minute, use24),
              world_clock::format_short_time((int)id(cfg_bedtime).hour, (int)id(cfg_bedtime).minute, use24),
              world_clock::format_short_time((int)id(cfg_quiet_time).hour, (int)id(cfg_quiet_time).minute, use24),
              world_clock::format_short_time((int)id(cfg_wakeup_time).hour, (int)id(cfg_wakeup_time).minute, use24),
          };
          auto resolve_msg = [&](const std::string &raw, const char *fallback) -> std::string {
            return world_clock::expand_tokens(raw.empty() ? fallback : raw, tctx);
          };

          uint8_t slp = id(sleep_phase);
          uint8_t m = id(active_occasion);
          int b_mon = (id(cfg_birthdate).month >= 1) ? (int)id(cfg_birthdate).month : 1;
          int b_day = (id(cfg_birthdate).day >= 1)   ? (int)id(cfg_birthdate).day   : 1;
          int wake_m = (int)id(cfg_wakeup_time).hour * 60 + (int)id(cfg_wakeup_time).minute;
          std::string tick = "CLASSIC WORLD DAY/NIGHT MAP";

          if (slp == 1) {
            tick = resolve_msg(id(cfg_msg_sleep_tick).state, "SLEEP TIME · BEFORE {quiet} \u2192 STAY IN BED");
          } else if (slp == 2) {
            tick = resolve_msg(id(cfg_msg_quiet_tick).state, "PAST {quiet} · QUIET PLAY IN YOUR ROOM OK");
          } else if (slp == 3) {
            if (m == 4 && id(keep_santa_winddown) && id(santa_wp_idx) >= 0) {
              char sw[64];
              snprintf(sw, sizeof(sw), "SANTA \u2192 %s · GET READY FOR BED!", id(santa_city).c_str());
              tick = sw;
            } else {
              tick = resolve_msg(id(cfg_msg_winddown_tick).state, "BEDTIME AT {bedtime} \u2192 GET READY FOR BED!");
            }
          } else if (m == 1) {
            if (!id(iss_has_fix)) {
              tick = "ISS RADAR  \u2192  SYNCING LIVE ORBITAL FEED...";
            } else {
              float ilat = id(iss_cur_lat), ilon = id(iss_cur_lon);
              float dist_iss = world_clock::haversine_km(id(active_lat), id(active_lon), ilat, ilon);
              const char *reg = "PACIFIC OCEAN";
              if (ilon >= -130.0f && ilon < -32.0f) {
                reg = (ilat >= 12.0f && ilon < -52.0f) ? "NORTH AMERICA" : ((ilat < 12.0f && ilon >= -84.0f) ? "SOUTH AMERICA" : "ATLANTIC OCEAN");
              } else if (ilon >= -32.0f && ilon < -12.0f) {
                reg = "ATLANTIC OCEAN";
              } else if (ilon >= -12.0f && ilon < 48.0f) {
                reg = (ilat >= 35.0f) ? "UK & EUROPE" : ((ilat >= -36.0f) ? "AFRICA" : "SOUTHERN OCEAN");
              } else if (ilon >= 48.0f && ilon < 105.0f) {
                reg = (ilat >= 5.0f) ? "ASIA" : "INDIAN OCEAN";
              } else if (ilon >= 105.0f && ilon < 165.0f) {
                reg = (ilat >= 8.0f) ? "EAST ASIA" : "AUSTRALIA";
              }

              int now_m = now.is_valid() ? (now.hour * 60 + now.minute) : -999;
              if (dist_iss < 900.0f) {
                tick = std::string("ISS FLYOVER NEAR ") + loc + " RIGHT NOW!";
              } else if (now.is_valid() && now_m >= wake_m && now_m < wake_m + 45) {
                tick = resolve_msg(id(cfg_msg_wake_tick).state, "GOOD MORNING, {name}!") + " · ISS \u2192 " + reg;
              } else if (now.is_valid() && now.month == b_mon && now.day_of_month < b_day) {
                char bbuf[64];
                snprintf(bbuf, sizeof(bbuf), "%d SLEEPS TO BIRTHDAY! · ISS \u2192 %s", b_day - now.day_of_month, reg);
                tick = bbuf;
              } else if (id(cfg_holidays_en).state && now.is_valid() && now.month == 10 && now.day_of_month >= 25 && now.day_of_month < 31) {
                char hbuf[64];
                snprintf(hbuf, sizeof(hbuf), "%d DAYS TO HALLOWEEN! · ISS \u2192 %s", 31 - now.day_of_month, reg);
                tick = hbuf;
              } else {
                tick = std::string(id(iss_is_eclipsed) ? "ISS (NIGHT SIDE) \u2192 OVER " : "SPACE STATION (ISS) \u2192 OVER ") + reg;
              }
            }
          } else if (m == 2) {
            int age = std::max(1, now.is_valid() ? (now.year - id(active_birth_year)) : 7);
            const char *ord = ((age % 100 >= 11 && age % 100 <= 13)) ? "TH"
                            : ((age % 10 == 1) ? "ST" : ((age % 10 == 2) ? "ND" : ((age % 10 == 3) ? "RD" : "TH")));
            char bb[64];
            snprintf(bb, sizeof(bb), "IT'S YOUR %d%s BIRTHDAY, %s!", age, ord, cname.c_str());
            tick = bb;
          } else if (m == 3) {
            int day_dec = (now.is_valid() && now.month == 12) ? std::clamp((int)now.day_of_month, 1, 24) : 16;
            int sleeps = 25 - day_dec;
            int filled = (day_dec * 8) / 24;
            std::string bar = "\uEE03";
            for (int k = 1; k <= 8; k++) bar += (k <= filled) ? "\uEE04" : "\uEE01";
            bar += (filled >= 8) ? "\uEE05" : "\uEE02";
            char xb[64];
            snprintf(xb, sizeof(xb), " %d %s TO XMAS!", sleeps, (sleeps == 1) ? "SLEEP" : "SLEEPS");
            tick = std::string("ADVENT ") + bar + xb;
          } else if (m == 9) {
            tick = std::string("MERRY CHRISTMAS MORNING, ") + cname + "!";
          } else if (m == 4) {
            if (id(santa_wp_idx) < 0) {
              tick = "CHRISTMAS EVE  \u2192  SLEIGH PREP AT NORTH POLE";
            } else if (id(santa_dist_km) < 120) {
              tick = std::string("SANTA IS OVER ") + loc + " RIGHT NOW!";
            } else {
              char st_b[64];
              int d_val = use_mi ? world_clock::km_to_mi(id(santa_dist_km)) : id(santa_dist_km);
              snprintf(st_b, sizeof(st_b), "SANTA \u2192 %s · %d %s AWAY!", id(santa_city).c_str(), d_val, use_mi ? "MI" : "KM");
              tick = st_b;
            }
          } else if (m == 5) {
            tick = "SPOOKY HALLOWEEN MODE  ·  HAPPY HALLOWEEN!";
          } else if (m == 6) {
            tick = std::string("HAPPY EASTER, ") + cname + "  ·  SPOT THE 5 EGGS!";
          } else if (m == 7) {
            tick = (now.is_valid() && now.month == 11) ? "REMEMBER, REMEMBER  ·  BONFIRE NIGHT!"
                                                       : (std::string("HAPPY NEW YEAR, ") + cname + "!");
          } else if (m == 8) {
            tick = "STAR WARS DAY  \u2192  TWIN SUNS & TIE PATROL";
          }
          world_clock::utf8_truncate_codepoints(tick, 44);
          lv_label_set_text(id(ticker_label), tick.c_str());

      - script.execute: update_dock_1hz
