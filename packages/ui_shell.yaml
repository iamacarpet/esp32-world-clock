# Shared LVGL Shell: Band 1 (Header), Band 2 (World Map), Band 3 Container, Top-Layer Boot/OTA Splash
lvgl:
  displays:
    - main_display
  buffer_size: 25%
  bg_color: 0x000000
  top_layer:
    widgets:
      # Full-screen boot & OTA splash always renders above Band 1, Band 2, and any pluggable Band 3 dock
      - obj:
          id: splash_overlay
          x: 0
          y: 0
          width: 800
          height: 480
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollbar_mode: "OFF"
          widgets:
            - obj:
                id: splash_card
                align: CENTER
                width: 620
                height: 250
                radius: 18
                bg_color: 0x0B0103
                bg_opa: COVER
                border_width: 2
                border_color: 0x4A0810
                pad_all: 0
                scrollbar_mode: "OFF"
                widgets:
                  - label:
                      id: splash_kicker
                      align: TOP_MID
                      y: 34
                      text: "${splash_kicker_text}"
                      text_font: font_fira_xs
                      text_color: 0x8F141B
                  - label:
                      id: splash_title
                      align: TOP_MID
                      y: 68
                      text: "STARTING UP..."
                      text_font: font_splash_lg
                      text_color: 0xE61922
                  - bar:
                      id: splash_bar
                      align: CENTER
                      y: 18
                      width: 480
                      height: 14
                      min_value: 0
                      max_value: 100
                      value: 20
                      radius: 7
                      bg_color: 0x220407
                      bg_opa: COVER
                      indicator:
                        bg_color: 0xE61922
                        bg_opa: COVER
                        radius: 7
                  - label:
                      id: splash_sub
                      align: BOTTOM_MID
                      y: -36
                      text: "Connecting..."
                      text_font: font_fira_sm
                      text_color: 0x94161E

      # Corner Wi-Fi & Backend Health Icons
      - label:
          id: wifi_icon_label
          align: TOP_RIGHT
          x: -10
          y: 10
          text: "\U000F05AA"
          text_font: font_icon_sm
          text_color: 0xE84A18
      - label:
          id: sync_icon_label
          align: TOP_RIGHT
          x: -10
          y: 38
          text: "\U000F063F"
          text_font: font_icon_sm
          text_color: 0xFFB830

  pages:
    - id: main_page
      bg_color: 0x000000
      scrollbar_mode: "OFF"
      widgets:
        # === BAND 1: TOP HEADER (y = 0..72) ===
        - label:
            id: date_label
            align: TOP_LEFT
            x: 12
            y: 10
            text: "Syncing Date..."
            text_font: font_date
            text_color: 0xD91E26

        - obj:
            id: loc_pill
            x: 255
            y: 9
            radius: 6
            bg_color: 0x1C0205
            bg_opa: COVER
            border_width: 1
            border_color: 0x5C0B13
            pad_left: 8
            pad_right: 8
            pad_top: 2
            pad_bottom: 2
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: loc_label
                  align: CENTER
                  text: "${default_location}"
                  text_font: font_fira_xs
                  text_color: 0xFF2B35

        - label:
            id: ticker_label
            align: TOP_LEFT
            x: 12
            y: 41
            text: "WORLD & SPACE CLOCK"
            text_font: font_fira_sm
            text_color: 0x94161E

        - label:
            id: clock_label
            align: TOP_RIGHT
            x: -84
            y: 4
            text: "--\u2236--\u2236--"
            text_font: font_clock
            text_color: 0xE61922

        - label:
            id: ampm_label
            align: TOP_RIGHT
            x: -36
            y: 20
            text: "AM"
            text_font: font_ampm
            text_color: 0xD91E26

        - obj:
            id: header_divider
            x: 10
            y: 71
            width: 780
            height: 2
            bg_color: 0x260407
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

        # === BAND 2: WIDESCREEN WORLD MAP + FLOATING RADAR TAG (y = 74..395) ===
        - canvas:
            id: world_canvas
            x: 0
            y: 74
            width: 800
            height: 322

        - obj:
            id: tracker_badge
            x: 400
            y: 200
            hidden: true
            radius: 5
            bg_color: 0x041E2B
            bg_opa: COVER
            border_width: 1
            border_color: 0x38BDF8
            pad_left: 6
            pad_right: 6
            pad_top: 2
            pad_bottom: 2
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: tracker_badge_lbl
                  align: CENTER
                  text: "ISS"
                  text_font: font_fira_xs
                  text_color: 0x7DD3FC

        # === BAND 3 DIVIDER (y = 397..399; pluggable dock mounts in y = 400..480) ===
        - obj:
            id: dock_divider
            x: 10
            y: 397
            width: 780
            height: 2
            bg_color: 0x260407
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"
