# Shared LVGL Shell: Band 1 (Header), Band 2 (World Map), Band 3 Container, Top-Layer Boot/OTA Splash
lvgl:
  displays:
    - main_display
  # 50% (buffer_frac=2 < MIN_BUFFER_FRAC/2) forces LVGL's draw buffer into 8MB Octal PSRAM
  # instead of stealing 192KB of precious internal SRAM (which left only 14KB free for Wi-Fi + TLS NetWorker!)
  buffer_size: 50%
  bg_color: 0x000000
  top_layer:
    widgets:
      # Full-screen boot & OTA splash always renders above Band 1, Band 2, and any pluggable Band 3 dock
      - obj:
          id: splash_overlay
          x: 0
          y: 0
          width: 800
          height: 480
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollbar_mode: "OFF"
          widgets:
            - obj:
                id: splash_card
                align: CENTER
                width: 740
                height: 268
                radius: 18
                bg_color: 0x0B0103
                bg_opa: COVER
                border_width: 2
                border_color: 0x4A0810
                pad_all: 0
                scrollbar_mode: "OFF"
                widgets:
                  - label:
                      id: splash_kicker
                      align: TOP_LEFT
                      x: 36
                      y: 30
                      text: "${splash_kicker_text}"
                      text_font: font_fira_xs
                      text_color: 0x8F141B
                  - label:
                      id: splash_title
                      align: TOP_LEFT
                      x: 36
                      y: 62
                      text: "STARTING UP..."
                      text_font: font_splash_lg
                      text_color: 0xE61922
                  - bar:
                      id: splash_bar
                      align: TOP_LEFT
                      x: 36
                      y: 126
                      width: 492
                      height: 14
                      min_value: 0
                      max_value: 100
                      value: 20
                      radius: 7
                      bg_color: 0x220407
                      bg_opa: COVER
                      indicator:
                        bg_color: 0xE61922
                        bg_opa: COVER
                        radius: 7
                  - label:
                      id: splash_sub
                      align: BOTTOM_LEFT
                      x: 36
                      y: -52
                      text: "Connecting..."
                      text_font: font_fira_sm
                      text_color: 0xD91E26
                  - label:
                      id: splash_hint
                      align: BOTTOM_LEFT
                      x: 36
                      y: -22
                      text: ""
                      text_font: font_fira_xs
                      text_color: 0x8F141B
                  - obj:
                      id: splash_qr_box
                      align: RIGHT_MID
                      x: -28
                      y: 0
                      width: 152
                      height: 152
                      radius: 10
                      bg_color: 0xC8141E
                      bg_opa: COVER
                      border_width: 0
                      pad_all: 0
                      hidden: true
                      scrollbar_mode: "OFF"
                      widgets:
                        - qrcode:
                            id: splash_qr
                            align: CENTER
                            size: 132
                            dark_color: 0x000000
                            light_color: 0xC8141E
                            text: "http://world-clock.local/"

      # Corner Wi-Fi & Backend Health Icons
      - label:
          id: wifi_icon_label
          align: TOP_RIGHT
          x: -10
          y: 10
          text: "\U000F05AA"
          text_font: font_icon_sm
          text_color: 0xE84A18
      - label:
          id: sync_icon_label
          align: TOP_RIGHT
          x: -10
          y: 38
          text: "\U000F063F"
          text_font: font_icon_sm
          text_color: 0xFFB830

  pages:
    - id: main_page
      bg_color: 0x000000
      scrollbar_mode: "OFF"
      widgets:
        # === BAND 1: TOP HEADER (y = 0..72) ===
        - label:
            id: date_label
            align: TOP_LEFT
            x: 12
            y: 10
            text: "Syncing Date..."
            text_font: font_date
            text_color: 0xD91E26

        - obj:
            id: loc_pill
            x: 255
            y: 9
            radius: 6
            bg_color: 0x1C0205
            bg_opa: COVER
            border_width: 1
            border_color: 0x5C0B13
            pad_left: 8
            pad_right: 8
            pad_top: 2
            pad_bottom: 2
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: loc_label
                  align: CENTER
                  text: "${default_location}"
                  text_font: font_fira_xs
                  text_color: 0xFF2B35

        - label:
            id: ticker_label
            align: TOP_LEFT
            x: 12
            y: 41
            text: "WORLD & SPACE CLOCK"
            text_font: font_fira_sm
            text_color: 0x94161E

        - label:
            id: clock_label
            align: TOP_RIGHT
            x: -84
            y: 4
            text: "--\u2236--\u2236--"
            text_font: font_clock
            text_color: 0xE61922

        - label:
            id: ampm_label
            align: TOP_RIGHT
            x: -36
            y: 20
            text: "AM"
            text_font: font_ampm
            text_color: 0xD91E26

        - obj:
            id: header_divider
            x: 10
            y: 71
            width: 780
            height: 2
            bg_color: 0x260407
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

        # === BAND 2: WIDESCREEN WORLD MAP + FLOATING RADAR TAG (y = 74..395) ===
        - canvas:
            id: world_canvas
            x: 0
            y: 74
            width: 800
            height: 322

        - obj:
            id: tracker_badge
            x: 400
            y: 200
            hidden: true
            radius: 5
            bg_color: 0x041E2B
            bg_opa: COVER
            border_width: 1
            border_color: 0x38BDF8
            pad_left: 6
            pad_right: 6
            pad_top: 2
            pad_bottom: 2
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: tracker_badge_lbl
                  align: CENTER
                  text: "ISS"
                  text_font: font_fira_xs
                  text_color: 0x7DD3FC

        # === BAND 3 DIVIDER (y = 397..399; pluggable dock mounts in y = 400..480) ===
        - obj:
            id: dock_divider
            x: 10
            y: 397
            width: 780
            height: 2
            bg_color: 0x260407
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"

        # Optional Morning Launchpad / Daily Routine Takeover Board (covers Band 2 during morning routine)
        - obj:
            id: launchpad_overlay
            x: 0
            y: 74
            width: 800
            height: 322
            bg_color: 0x05070B
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            hidden: true
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  id: lp_school_pill
                  x: 24
                  y: 16
                  radius: 8
                  bg_color: 0x0B3B3A
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x14B8A6
                  pad_left: 12
                  pad_right: 12
                  pad_top: 5
                  pad_bottom: 5
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: lp_school_lbl
                        align: CENTER
                        text: "SCHOOL DAY"
                        text_font: font_fira_sm
                        text_color: 0x5EEAD4
              - label:
                  id: lp_countdown_lbl
                  align: TOP_RIGHT
                  x: -24
                  y: 20
                  text: "LEAVE FOR SCHOOL IN 22 MIN"
                  text_font: font_date
                  text_color: 0xFFF6EA
              - bar:
                  id: lp_countdown_bar
                  x: 24
                  y: 62
                  width: 752
                  height: 10
                  min_value: 0
                  max_value: 100
                  value: 65
                  radius: 5
                  bg_color: 0x151B26
                  bg_opa: COVER
                  indicator:
                    bg_color: 0x14B8A6
                    bg_opa: COVER
                    radius: 5
              - obj:
                  id: lp_left_card
                  x: 24
                  y: 88
                  width: 368
                  height: 214
                  radius: 14
                  bg_color: 0x0C1018
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x1F2937
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: lp_left_kicker
                        x: 18
                        y: 14
                        text: "TODAY'S PLAN & ROUTINE"
                        text_font: font_fira_xs
                        text_color: 0xFF9F1C
                    - label:
                        id: lp_plan_1
                        x: 18
                        y: 48
                        width: 332
                        height: 22
                        long_mode: DOT
                        text: "• PE Kit & Trainers"
                        text_font: font_card_title
                        text_color: 0xFFF6EA
                    - label:
                        id: lp_plan_2
                        x: 18
                        y: 96
                        width: 332
                        height: 19
                        long_mode: DOT
                        text: "• Swimming Lesson (4 PM)"
                        text_font: font_card_sub
                        text_color: 0xD4D4D8
                    - label:
                        id: lp_plan_3
                        x: 18
                        y: 144
                        width: 332
                        height: 19
                        long_mode: DOT
                        text: "• Tomorrow: Non-Uniform Day"
                        text_font: font_card_sub
                        text_color: 0x9CA3AF
              - obj:
                  id: lp_right_card
                  x: 408
                  y: 88
                  width: 368
                  height: 214
                  radius: 14
                  bg_color: 0x0C1018
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x1F2937
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: lp_right_kicker
                        x: 18
                        y: 14
                        text: "PACK & WEAR FOR TODAY"
                        text_font: font_fira_xs
                        text_color: 0x38BDF8
                    - label:
                        id: lp_wx_summary
                        x: 18
                        y: 48
                        width: 332
                        height: 22
                        long_mode: DOT
                        text: "Dry Now · Rain Later (75%)!"
                        text_font: font_card_title
                        text_color: 0xFFF6EA
                    - label:
                        id: lp_wx_prep
                        x: 18
                        y: 92
                        width: 332
                        height: 19
                        long_mode: DOT
                        text: "Pack Warm Raincoat & Umbrella"
                        text_font: font_card_sub
                        text_color: 0x93C5FD
                    - obj:
                        id: lp_holiday_pill
                        x: 18
                        y: 146
                        width: 332
                        height: 44
                        radius: 8
                        bg_color: 0x1C1406
                        bg_opa: COVER
                        border_width: 1
                        border_color: 0xB45309
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - label:
                              id: lp_holiday_lbl
                              align: CENTER
                              width: 316
                              height: 20
                              text_align: CENTER
                              long_mode: DOT
                              text: "8 SLEEPS TO HALF TERM!"
                              text_font: font_fira_sm
                              text_color: 0xFCD34D

        # Autism-Friendly "Now & Next" Event Countdown Takeover Board (visually distinct Indigo/Violet theme)
        - obj:
            id: event_takeover_overlay
            x: 0
            y: 74
            width: 800
            height: 322
            bg_color: 0x060711
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            hidden: true
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  id: ev_status_pill
                  x: 24
                  y: 14
                  radius: 8
                  bg_color: 0x1E1B4B
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x818CF8
                  pad_left: 10
                  pad_right: 12
                  pad_top: 4
                  pad_bottom: 4
                  scrollbar_mode: "OFF"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_column: 8
                  widgets:
                    - label:
                        id: ev_status_icon
                        text: "\U000F051B"
                        text_font: font_icon_sm
                        text_color: 0xC7D2FE
                    - label:
                        id: ev_status_lbl
                        text: "UP NEXT"
                        text_font: font_fira_sm
                        text_color: 0xE0E7FF
              - label:
                  id: ev_countdown_lbl
                  align: TOP_RIGHT
                  x: -24
                  y: 18
                  text: "LEAVE IN 14 MIN"
                  text_font: font_date
                  text_color: 0xFFF6EA
              - bar:
                  id: ev_progress_bar
                  x: 24
                  y: 60
                  width: 752
                  height: 10
                  min_value: 0
                  max_value: 100
                  value: 55
                  radius: 5
                  bg_color: 0x17182B
                  bg_opa: COVER
                  indicator:
                    bg_color: 0x818CF8
                    bg_opa: COVER
                    radius: 5
              # Wide Left Hero Card: Single Focus Event ("NOW / UP NEXT")
              - obj:
                  id: ev_hero_card
                  x: 24
                  y: 84
                  width: 452
                  height: 220
                  radius: 14
                  bg_color: 0x0E1022
                  bg_opa: COVER
                  border_width: 2
                  border_color: 0x3730A3
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: ev_hero_kicker
                        x: 20
                        y: 15
                        text: "NOW & NEXT · CALENDAR COUNTDOWN"
                        text_font: font_fira_xs
                        text_color: 0xA5B4FC
                    - label:
                        id: ev_hero_title
                        x: 20
                        y: 44
                        width: 412
                        height: 66
                        long_mode: WRAP
                        text: "SWIMMING LESSON"
                        text_font: font_splash_lg
                        text_color: 0xFFF6EA
                    - label:
                        id: ev_hero_time
                        x: 20
                        y: 122
                        width: 412
                        height: 22
                        long_mode: DOT
                        text: "4:00 PM - 5:00 PM"
                        text_font: font_card_title
                        text_color: 0xE0E7FF
                    - label:
                        id: ev_hero_travel
                        x: 20
                        y: 154
                        width: 412
                        height: 20
                        long_mode: DOT
                        text: "15m travel · Leave by 3:45 PM"
                        text_font: font_fira_sm
                        text_color: 0xFCD34D
                    - label:
                        id: ev_hero_loc
                        x: 20
                        y: 184
                        width: 412
                        height: 19
                        long_mode: DOT
                        text: "@ Leisure Centre"
                        text_font: font_card_sub
                        text_color: 0x94A3B8
              # Right Column Top Mini-Card: Compact "LATER TODAY · THEN" Preview (Prioritises Timed Events!)
              - obj:
                  id: ev_next_card
                  x: 492
                  y: 84
                  width: 284
                  height: 112
                  radius: 14
                  bg_color: 0x0D111C
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x262C40
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: ev_next_kicker
                        x: 16
                        y: 12
                        text: "LATER TODAY · THEN"
                        text_font: font_fira_xs
                        text_color: 0xA5B4FC
                    - label:
                        id: ev_next_1
                        x: 16
                        y: 36
                        width: 252
                        height: 40
                        long_mode: WRAP
                        text: "6:00 PM · DINNER AT NANA'S"
                        text_font: font_fira_sm
                        text_color: 0xFFF6EA
                    - label:
                        id: ev_next_2
                        x: 16
                        y: 82
                        width: 252
                        height: 19
                        long_mode: DOT
                        text: "Tomorrow -> Non-Uniform Day"
                        text_font: font_card_sub
                        text_color: 0x9CA3AF
              # Right Column Bottom Mini-Card: Compact Weather Prep ("Need a Coat / Sun Cream?")
              - obj:
                  id: ev_wx_card
                  x: 492
                  y: 208
                  width: 284
                  height: 96
                  radius: 14
                  bg_color: 0x0D111C
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x262C40
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: ev_wx_kicker
                        x: 16
                        y: 12
                        text: "WEATHER PREP"
                        text_font: font_fira_xs
                        text_color: 0x38BDF8
                    - label:
                        id: ev_wx_line1
                        x: 16
                        y: 36
                        width: 252
                        height: 20
                        long_mode: DOT
                        text: "Dry Now · Rain Later (75%)!"
                        text_font: font_fira_sm
                        text_color: 0xFFF6EA
                    - label:
                        id: ev_wx_line2
                        x: 16
                        y: 62
                        width: 252
                        height: 19
                        long_mode: DOT
                        text: "Pack Warm Raincoat & Umbrella"
                        text_font: font_card_sub
                        text_color: 0x93C5FD
